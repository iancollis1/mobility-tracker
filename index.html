<title>Mobility Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mobile-first mobility & activation tracker">
<meta name="theme-color" content="#0a0b0d">
<style>
:root{
  --bg:#0a0b0d;
  --bg-elev:#131519;
  --bg-elev-2:#1a1d23;
  --border:#262a31;
  --border-soft:#1e2127;
  --text:#eef0f2;
  --text-dim:#9aa1ab;
  --text-faint:#6b7280;
  --blue:#5b9dff;
  --orange:#ff9c4a;
  --purple:#b585ff;
  --green:#41d999;
  --red:#ff5d5d;
  --yellow:#ffc94a;
  --accent:var(--blue);
  --accent-dim:rgba(91,157,255,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:48px;
  min-height:100vh;
}
[data-theme="push"]{--accent:var(--orange);--accent-dim:rgba(255,156,74,.14)}
[data-theme="pull"]{--accent:var(--purple);--accent-dim:rgba(181,133,255,.14)}
[data-theme="legs"]{--accent:var(--green);--accent-dim:rgba(65,217,153,.14)}

header.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(10,11,13,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:14px 16px 10px;
}
header.topbar h1{
  margin:0 0 10px;
  font-size:17px;
  font-weight:700;
  letter-spacing:.2px;
  display:flex;align-items:center;gap:8px;
}
header.topbar h1 .dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--accent);
  transition:background .2s;
  box-shadow:0 0 0 4px var(--accent-dim);
}

nav.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  padding-bottom:2px;
}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  flex:0 0 auto;
  background:var(--bg-elev);
  color:var(--text-dim);
  border:1px solid var(--border);
  border-radius:20px;
  padding:8px 14px;
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  cursor:pointer;
  transition:all .15s;
}
nav.tabs button.active{
  background:var(--tab-accent,var(--blue));
  border-color:var(--tab-accent,var(--blue));
  color:#0a0b0d;
}
nav.tabs button[data-tab="daily"].active{--tab-accent:var(--blue)}
nav.tabs button[data-tab^="push"].active{--tab-accent:var(--orange)}
nav.tabs button[data-tab^="pull"].active{--tab-accent:var(--purple)}
nav.tabs button[data-tab^="legs"].active{--tab-accent:var(--green)}

main{
  max-width:640px;
  margin:0 auto;
  padding:16px 14px 8px;
}

.intro-note{
  background:var(--accent-dim);
  border:1px solid var(--accent);
  color:var(--text);
  font-size:13.5px;
  line-height:1.5;
  padding:10px 12px;
  border-radius:10px;
  margin-bottom:14px;
}

/* ---- personal mods banner ---- */
details.mods-banner{
  background:var(--bg-elev);
  border:1px solid var(--yellow);
  border-radius:12px;
  margin-bottom:14px;
  overflow:hidden;
}
details.mods-banner summary{
  list-style:none;
  cursor:pointer;
  padding:12px 14px;
  font-weight:700;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:var(--yellow);
}
details.mods-banner summary::-webkit-details-marker{display:none}
details.mods-banner summary::after{
  content:"›";
  transform:rotate(90deg);
  transition:transform .15s;
  font-size:20px;
  line-height:1;
  color:var(--text-faint);
}
details.mods-banner[open] summary::after{transform:rotate(270deg)}
.mods-list{
  padding:2px 14px 14px;
  display:flex;
  flex-direction:column;
  gap:9px;
}
.mods-list div{
  font-size:13.5px;
  line-height:1.45;
  color:var(--text-dim);
}
.mods-list b{color:var(--text);font-weight:600}

/* ---- mobility scores ---- */
.scores-card{
  background:var(--bg-elev);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  margin-bottom:16px;
}
.scores-card h2{
  margin:0 0 12px;
  font-size:14px;
  font-weight:700;
  color:var(--text-dim);
  text-transform:uppercase;
  letter-spacing:.5px;
}
.score-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}
.score-row:last-child{margin-bottom:0}
.score-label{
  flex:0 0 118px;
  font-size:13px;
  color:var(--text);
  font-weight:600;
}
.score-bar-track{
  flex:1;
  height:8px;
  background:var(--bg-elev-2);
  border-radius:6px;
  overflow:hidden;
}
.score-bar-fill{height:100%;border-radius:6px}
.score-pct{
  flex:0 0 auto;
  font-size:12.5px;
  font-weight:700;
  color:var(--text-dim);
  min-width:44px;
  text-align:right;
}

/* ---- session cards (daily) ---- */
.session-card{
  background:var(--bg-elev);
  border:1px solid var(--border);
  border-left:3px solid var(--accent);
  border-radius:12px;
  padding:14px;
  margin-bottom:14px;
}
.session-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:6px;
  flex-wrap:wrap;
}
.session-head h3{
  margin:0;
  font-size:16px;
  font-weight:700;
}
.session-note{
  font-size:12.5px;
  color:var(--text-faint);
  margin:0 0 10px;
  font-style:italic;
}
.toggle{
  display:flex;
  background:var(--bg-elev-2);
  border-radius:8px;
  padding:3px;
  gap:3px;
}
.toggle-btn{
  background:transparent;
  border:none;
  color:var(--text-dim);
  font-size:11.5px;
  font-weight:700;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
  line-height:1.3;
  text-align:center;
}
.toggle-btn span{display:block;font-weight:500;font-size:10px;opacity:.8}
.toggle-btn.active{background:var(--accent);color:#0a0b0d}

/* ---- exercise list / accordion ---- */
.ex-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
details.exercise{
  background:var(--bg-elev-2);
  border:1px solid var(--border-soft);
  border-radius:10px;
  overflow:hidden;
}
details.exercise summary{
  list-style:none;
  cursor:pointer;
  padding:10px 12px;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:6px 8px;
}
details.exercise summary::-webkit-details-marker{display:none}
.ex-name{font-size:13.5px;font-weight:600;color:var(--text)}
.ex-dur{font-size:12px;color:var(--text-faint);font-weight:500}
.ex-chevron{
  margin-left:auto;
  color:var(--text-faint);
  font-size:18px;
  transform:rotate(90deg);
  transition:transform .15s;
}
details.exercise[open] .ex-chevron{transform:rotate(270deg)}
.badge{
  font-size:10.5px;
  font-weight:700;
  padding:2px 7px;
  border-radius:20px;
  letter-spacing:.2px;
  white-space:nowrap;
}
.badge-critical{background:rgba(255,93,93,.15);color:var(--red);border:1px solid rgba(255,93,93,.4)}
.badge-mod{background:rgba(255,201,74,.15);color:var(--yellow);border:1px solid rgba(255,201,74,.4)}
.ex-body{
  padding:0 12px 14px;
  border-top:1px solid var(--border-soft);
  padding-top:10px;
}
.ex-body p{margin:0 0 10px;font-size:13px;line-height:1.5;color:var(--text-dim)}
.ex-body p strong{color:var(--text);font-weight:600}
.ex-cues{margin:0 0 10px}
.ex-cues > span{font-size:13px;color:var(--text-dim)}
.ex-cues strong{color:var(--text);font-weight:600;font-size:13px}
.ex-cues ul{margin:6px 0 0;padding-left:18px}
.ex-cues li{font-size:13px;line-height:1.5;color:var(--text-dim);margin-bottom:3px}
.ex-tip{
  background:var(--accent-dim);
  border-radius:8px;
  padding:8px 10px;
  margin-bottom:0 !important;
}

/* ---- training tab grid ---- */
.tab-subtitle{
  font-size:12.5px;
  color:var(--text-faint);
  margin:0 0 14px;
  line-height:1.5;
}
.section-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
@media (max-width:420px){
  .section-grid{grid-template-columns:1fr}
}
details.section-card{
  background:var(--bg-elev);
  border:1px solid var(--border);
  border-top:3px solid var(--accent);
  border-radius:12px;
  overflow:hidden;
  grid-column:span 1;
}
details.section-card[open]{grid-column:1 / -1}
details.section-card summary{
  list-style:none;
  cursor:pointer;
  padding:13px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
}
details.section-card summary::-webkit-details-marker{display:none}
details.section-card summary h3{
  margin:0;
  font-size:13.5px;
  font-weight:700;
  line-height:1.3;
}
details.section-card summary .sec-time{
  font-size:11px;
  color:var(--text-faint);
  font-weight:600;
  white-space:nowrap;
}
details.section-card .sec-body{padding:0 12px 12px}

footer.app-footer{
  max-width:640px;
  margin:24px auto 0;
  padding:0 14px;
  font-size:11.5px;
  color:var(--text-faint);
  text-align:center;
  line-height:1.6;
}
</style>

<header class="topbar">
  <h1><span class="dot" id="themeDot"></span> Mobility Tracker</h1>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="content"></main>

const TABS = {
  daily: {label:"Daily", theme:"daily", type:"daily"},
  pushA: {label:"Push A", theme:"push", type:"training", subtitle:"Same push mobility protocol for both push sessions — track how it feels as fatigue accumulates across the week.", sections:pushSections},
  pullA: {label:"Pull A", theme:"pull", type:"training", subtitle:"Same pull mobility protocol for both pull sessions — track how it feels as fatigue accumulates across the week.", sections:pullSections},
  legsA: {label:"Legs A", theme:"legs", type:"training", subtitle:"Same leg mobility protocol for both leg sessions — this is where most of your priority work lives.", sections:legsSections},
  pushB: {label:"Push B", theme:"push", type:"training", subtitle:"Same push mobility protocol for both push sessions — track how it feels as fatigue accumulates across the week.", sections:pushSections},
  pullB: {label:"Pull B", theme:"pull", type:"training", subtitle:"Same pull mobility protocol for both pull sessions — track how it feels as fatigue accumulates across the week.", sections:pullSections},
  legsB: {label:"Legs B", theme:"legs", type:"training", subtitle:"Same leg mobility protocol for both leg sessions — this is where most of your priority work lives.", sections:legsSections}
};
const TAB_ORDER = ["daily","pushA","pullA","legsA","pushB","pullB","legsB"];

/* ============================= RENDER ============================= */

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function badgesHTML(ex){
  let h = "";
  if (ex.critical) h += `<span class="badge badge-critical">🔴 CRITICAL</span>`;
  if (ex.mod) h += `<span class="badge badge-mod">⚠️ MOD</span>`;
  return h;
}

function exerciseHTML(ex){
  return `<details class="exercise">
    <summary>
      <span class="ex-name">${esc(ex.name)}</span>
      <span class="ex-dur">${esc(ex.dur)}</span>
      ${badgesHTML(ex)}
      <span class="ex-chevron">›</span>
    </summary>
    <div class="ex-body">
      <p>📍 <strong>Where to feel it:</strong> ${esc(ex.feel)}</p>
      <div class="ex-cues">→ <strong>Coaching cues</strong>
        <ul>${ex.cues.map(c => `<li>${esc(c)}</li>`).join("")}</ul>
      </div>
      <p class="ex-tip">💡 <strong>Tip:</strong> ${ex.tip}</p>
    </div>
  </details>`;
}

function modsBannerHTML(){
  return `<details class="mods-banner">
    <summary>⚠️ Personal Modifications</summary>
    <div class="mods-list">
      ${MODS.map(m => `<div>${m}</div>`).join("")}
    </div>
  </details>`;
}

function scoresCardHTML(){
  return `<div class="scores-card">
    <h2>Mobility Scores</h2>
    ${SCORES.map(s => `
      <div class="score-row">
        <span class="score-label">${esc(s.label)}</span>
        <span class="score-bar-track"><span class="score-bar-fill" style="width:${s.pct}%;background:${s.color}"></span></span>
        <span class="score-pct">${s.icon} ${s.pct}%</span>
      </div>
    `).join("")}
  </div>`;
}

function sessionCardHTML(session){
  const hasExtended = session.extendedAdds && session.extendedAdds.length;
  return `<div class="session-card" data-session-id="${session.id}">
    <div class="session-head">
      <h3>${esc(session.title)}</h3>
      <div class="toggle" role="group">
        <button class="toggle-btn mode-btn active" data-mode="quick" type="button">Quick<span>${esc(session.quickTime)}</span></button>
        <button class="toggle-btn mode-btn" data-mode="extended" type="button">Extended<span>${esc(session.extTime)}</span></button>
      </div>
    </div>
    ${session.note ? `<p class="session-note">${esc(session.note)}</p>` : ""}
    <div class="ex-list">
      ${session.quick.map(exerciseHTML).join("")}
      ${hasExtended ? `<div class="extended-only" hidden>${session.extendedAdds.map(exerciseHTML).join("")}</div>` : ""}
    </div>
  </div>`;
}

function renderDaily(){
  return `
    <div class="intro-note">${esc(DAILY.note)}</div>
    ${modsBannerHTML()}
    ${scoresCardHTML()}
    ${DAILY.sessions.map(sessionCardHTML).join("")}
  `;
}

function renderTraining(tab){
  const sections = tab.sections();
  return `
    <p class="tab-subtitle">${esc(tab.subtitle)}</p>
    <div class="section-grid">
      ${sections.map(sec => `
        <details class="section-card">
          <summary>
            <h3>${esc(sec.title)}</h3>
            <span class="sec-time">${esc(sec.time)}</span>
          </summary>
          <div class="sec-body ex-list">
            ${sec.exercises.map(exerciseHTML).join("")}
          </div>
        </details>
      `).join("")}
    </div>
  `;
}

function renderTab(key){
  const tab = TABS[key];
  document.body.dataset.theme = tab.theme;
  const content = document.getElementById("content");
  content.innerHTML = tab.type === "daily" ? renderDaily() : renderTraining(tab);
}

function renderTabs(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = TAB_ORDER.map(key =>
    `<button data-tab="${key}" type="button">${esc(TABS[key].label)}</button>`
  ).join("");
}

function setActiveTab(key){
  document.querySelectorAll("#tabs button").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === key);
  });
  renderTab(key);
  try { localStorage.setItem("mt-active-tab", key); } catch(e){}
}

/* ============================= EVENTS ============================= */

document.addEventListener("click", e => {
  const tabBtn = e.target.closest("#tabs button");
  if (tabBtn) {
    setActiveTab(tabBtn.dataset.tab);
    return;
  }
  const modeBtn = e.target.closest(".mode-btn");
  if (modeBtn) {
    const card = modeBtn.closest(".session-card");
    card.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b === modeBtn));
    const extendedOnly = card.querySelector(".extended-only");
    if (extendedOnly) extendedOnly.hidden = modeBtn.dataset.mode !== "extended";
    return;
  }
});

/* ============================= INIT ============================= */

renderTabs();
let startTab = "daily";
try {
  const saved = localStorage.getItem("mt-active-tab");
  if (saved && TABS[saved]) startTab = saved;
} catch(e){}
setActiveTab(startTab);
</script>
