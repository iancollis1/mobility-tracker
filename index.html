<title>Mobility Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mobile-first mobility & activation tracker">
<meta name="theme-color" content="#f5f2ea">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --chalk:#1a1a16;
    --iron:#f5f2ea;
    --iron-soft:#ffffff;
    --iron-raised:#ebe6d9;
    --line:#b8b0a0;
    --dim:#4a463e;
    --plate-red:#a8351f;
    --plate-blue:#2a5694;
    --plate-green:#3d7d40;
    --plate-amber:#96680f;
    --accent:var(--plate-blue);
    --accent-dim:rgba(42,86,148,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{margin:0;padding:0}
  body{
    background:var(--iron);
    color:var(--chalk);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding-bottom:48px;
  }
  [data-theme="daily"]{--accent:var(--plate-blue);--accent-dim:rgba(42,86,148,.10)}
  [data-theme="push"]{--accent:var(--plate-red);--accent-dim:rgba(168,53,31,.10)}
  [data-theme="pull"]{--accent:var(--plate-amber);--accent-dim:rgba(150,104,15,.10)}
  [data-theme="legs"]{--accent:var(--plate-green);--accent-dim:rgba(61,125,64,.10)}

  header.topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(245,242,234,.94);
    backdrop-filter:blur(6px);
    border-bottom:2px solid var(--chalk);
    padding:16px 16px 12px;
  }
  .eyebrow{
    font-family:'DM Mono', monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:2px;
  }
  header.topbar h1{
    font-family:'Bebas Neue', sans-serif;
    font-size:28px;
    letter-spacing:.02em;
    line-height:1;
    display:flex;align-items:center;gap:8px;
    margin:2px 0 12px;
    color:var(--chalk);
  }
  header.topbar h1 .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 4px var(--accent-dim);
  }

  nav.tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    padding-bottom:2px;
  }
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{
    flex:0 0 auto;
    background:var(--iron-soft);
    color:var(--chalk);
    border:2px solid var(--line);
    border-radius:5px;
    padding:9px 13px;
    font-family:'DM Mono', monospace;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    white-space:nowrap;
    cursor:pointer;
  }
  nav.tabs button.active{
    background:var(--tab-accent,var(--plate-blue));
    border-color:var(--tab-accent,var(--plate-blue));
    color:#fff;
    font-weight:700;
  }
  nav.tabs button[data-tab="daily"].active{--tab-accent:var(--plate-blue)}
  nav.tabs button[data-tab^="push"].active{--tab-accent:var(--plate-red)}
  nav.tabs button[data-tab^="pull"].active{--tab-accent:var(--plate-amber)}
  nav.tabs button[data-tab^="legs"].active{--tab-accent:var(--plate-green)}

  main{
    max-width:640px;
    margin:0 auto;
    padding:18px 14px 8px;
  }

  .intro-note{
    background:var(--iron-soft);
    border:1px dashed var(--line);
    color:var(--dim);
    font-family:'DM Mono', monospace;
    font-size:12.5px;
    line-height:1.6;
    padding:10px 14px;
    border-radius:6px;
    margin-bottom:14px;
  }

  /* ---- personal mods banner ---- */
  details.mods-banner{
    background:var(--iron-soft);
    border:1.5px dashed var(--plate-amber);
    border-radius:6px;
    margin-bottom:14px;
    overflow:hidden;
  }
  details.mods-banner summary{
    list-style:none;
    cursor:pointer;
    padding:12px 14px;
    font-family:'DM Mono', monospace;
    font-weight:700;
    font-size:13px;
    letter-spacing:.05em;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:var(--plate-amber);
  }
  details.mods-banner summary::-webkit-details-marker{display:none}
  details.mods-banner summary::after{
    content:"›";
    transform:rotate(90deg);
    transition:transform .15s;
    font-size:20px;
    line-height:1;
    color:var(--dim);
  }
  details.mods-banner[open] summary::after{transform:rotate(270deg)}
  .mods-list{
    padding:2px 14px 14px;
    display:flex;
    flex-direction:column;
    gap:9px;
    border-top:1px dashed var(--line);
  }
  .mods-list div{
    font-family:'DM Mono', monospace;
    font-size:12.5px;
    line-height:1.5;
    color:var(--dim);
    padding-top:9px;
  }
  .mods-list div:first-child{padding-top:10px}
  .mods-list b{color:var(--chalk);font-weight:600}

  /* ---- mobility scores ---- */
  .scores-card{
    background:var(--iron-soft);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px;
    margin-bottom:16px;
  }
  .scores-card h2{
    font-family:'DM Mono', monospace;
    margin:0 0 12px;
    font-size:12px;
    font-weight:700;
    color:var(--dim);
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  .score-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .score-row:last-child{margin-bottom:0}
  .score-label{
    flex:0 0 118px;
    font-family:'Inter', sans-serif;
    font-size:13px;
    color:var(--chalk);
    font-weight:600;
  }
  .score-bar-track{
    flex:1;
    height:8px;
    background:var(--iron-raised);
    border:1px solid var(--line);
    border-radius:4px;
    overflow:hidden;
  }
  .score-bar-fill{height:100%}
  .score-pct{
    flex:0 0 auto;
    font-family:'DM Mono', monospace;
    font-size:12.5px;
    font-weight:700;
    color:var(--dim);
    min-width:48px;
    text-align:right;
  }

  /* ---- session cards (daily) ---- */
  .session-card{
    background:var(--iron-soft);
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    border-radius:6px;
    padding:14px;
    margin-bottom:14px;
  }
  .session-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:6px;
    flex-wrap:wrap;
  }
  .session-head h3{
    font-family:'Bebas Neue', sans-serif;
    font-size:26px;
    letter-spacing:.02em;
    color:var(--chalk);
    margin:0;
  }
  .session-note{
    font-family:'DM Mono', monospace;
    font-size:12px;
    color:var(--dim);
    margin:0 0 10px;
    font-style:italic;
  }
  .toggle{
    display:flex;
    gap:6px;
  }
  .toggle-btn{
    background:var(--iron-raised);
    border:2px solid var(--line);
    color:var(--chalk);
    font-family:'DM Mono', monospace;
    font-size:11px;
    font-weight:600;
    padding:6px 10px;
    border-radius:5px;
    cursor:pointer;
    line-height:1.3;
    text-align:center;
  }
  .toggle-btn span{display:block;font-weight:500;font-size:9.5px;color:var(--dim);margin-top:1px}
  .toggle-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .toggle-btn.active span{color:rgba(255,255,255,.85)}

  /* ---- exercise list / accordion ---- */
  .ex-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  details.exercise{
    background:var(--iron-soft);
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
  }
  details.exercise summary{
    list-style:none;
    cursor:pointer;
    padding:11px 12px;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px 8px;
  }
  details.exercise summary::-webkit-details-marker{display:none}
  .ex-name{font-family:'Bebas Neue', sans-serif;font-size:18px;letter-spacing:.01em;color:var(--chalk)}
  .ex-dur{font-family:'DM Mono', monospace;font-size:11.5px;color:var(--dim)}
  .ex-chevron{
    margin-left:auto;
    color:var(--dim);
    font-size:18px;
    transform:rotate(90deg);
    transition:transform .15s;
  }
  details.exercise[open] .ex-chevron{transform:rotate(270deg)}
  .badge{
    font-family:'DM Mono', monospace;
    font-size:10px;
    font-weight:700;
    padding:4px 8px;
    border-radius:4px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#fff;
    white-space:nowrap;
  }
  .badge-critical{background:var(--plate-red)}
  .badge-mod{background:var(--plate-amber)}
  .ex-body{
    padding:0 12px 14px;
    border-top:1px solid var(--line);
    padding-top:10px;
    font-family:'DM Mono', monospace;
    color:var(--dim);
  }
  .ex-body p{margin:0 0 10px;font-size:12.5px;line-height:1.55}
  .ex-body p strong{color:var(--chalk);font-weight:600}
  .ex-cues{margin:0 0 10px}
  .ex-cues > strong{color:var(--chalk);font-weight:600;font-size:12.5px}
  .ex-cues ul{margin:6px 0 0;padding-left:18px}
  .ex-cues li{font-size:12.5px;line-height:1.55;font-style:italic;margin-bottom:3px}
  .ex-tip{background:var(--accent-dim);border-radius:5px;padding:8px 10px;margin-bottom:0 !important}
  .ex-tip, .ex-tip strong{color:var(--accent)}

  /* ---- training tab grid ---- */
  .tab-subtitle{
    font-family:'DM Mono', monospace;
    font-size:12px;
    color:var(--dim);
    margin:0 0 14px;
    line-height:1.6;
  }
  .section-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  @media (max-width:420px){
    .section-grid{grid-template-columns:1fr}
  }
  details.section-card{
    background:var(--iron-soft);
    border:1px solid var(--line);
    border-top:4px solid var(--accent);
    border-radius:6px;
    overflow:hidden;
    grid-column:span 1;
  }
  details.section-card[open]{grid-column:1 / -1}
  details.section-card summary{
    list-style:none;
    cursor:pointer;
    padding:13px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
  }
  details.section-card summary::-webkit-details-marker{display:none}
  details.section-card summary h3{
    font-family:'Bebas Neue', sans-serif;
    font-size:21px;
    letter-spacing:.02em;
    color:var(--chalk);
    margin:0;
    line-height:1.2;
  }
  details.section-card summary .sec-time{
    font-family:'DM Mono', monospace;
    font-size:11px;
    color:var(--dim);
    font-weight:600;
    white-space:nowrap;
  }
  details.section-card .sec-body{padding:0 12px 12px}

  footer.app-footer{
    max-width:640px;
    margin:24px auto 0;
    padding:0 14px;
    font-family:'DM Mono', monospace;
    font-size:11px;
    color:var(--dim);
    text-align:center;
    line-height:1.6;
  }
</style>

<header class="topbar">
  <div class="eyebrow">Mobility &amp; Activation</div>
  <h1><span class="dot" id="themeDot"></span> Mobility Tracker</h1>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="content"></main>

<footer class="app-footer">Personal mobility & activation reference — not medical advice. Stop on any sharp or shooting pain.</footer>

};
const TAB_ORDER = ["daily","pushA","pullA","legsA","pushB","pullB","legsB"];

/* ============================= RENDER ============================= */

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function badgesHTML(ex){
  let h = "";
  if (ex.critical) h += `<span class="badge badge-critical">🔴 CRITICAL</span>`;
  if (ex.mod) h += `<span class="badge badge-mod">⚠️ MOD</span>`;
  return h;
}

function exerciseHTML(ex){
  return `<details class="exercise">
    <summary>
      <span class="ex-name">${esc(ex.name)}</span>
      <span class="ex-dur">${esc(ex.dur)}</span>
      ${badgesHTML(ex)}
      <span class="ex-chevron">›</span>
    </summary>
    <div class="ex-body">
      <p>📍 <strong>Where to feel it:</strong> ${esc(ex.feel)}</p>
      <div class="ex-cues">→ <strong>Coaching cues</strong>
        <ul>${ex.cues.map(c => `<li>${esc(c)}</li>`).join("")}</ul>
      </div>
      <p class="ex-tip">💡 <strong>Tip:</strong> ${ex.tip}</p>
    </div>
  </details>`;
}

function modsBannerHTML(){
  return `<details class="mods-banner">
    <summary>⚠️ Personal Modifications</summary>
    <div class="mods-list">
      ${MODS.map(m => `<div>${m}</div>`).join("")}
    </div>
  </details>`;
}

function scoresCardHTML(){
  return `<div class="scores-card">
    <h2>Mobility Scores</h2>
    ${SCORES.map(s => `
      <div class="score-row">
        <span class="score-label">${esc(s.label)}</span>
        <span class="score-bar-track"><span class="score-bar-fill" style="width:${s.pct}%;background:${s.color}"></span></span>
        <span class="score-pct">${s.icon} ${s.pct}%</span>
      </div>
    `).join("")}
  </div>`;
}

function sessionCardHTML(session){
  const hasExtended = session.extendedAdds && session.extendedAdds.length;
  const extendedMode = session.replaceOnExtended ? "replace" : "append";
  return `<div class="session-card" data-session-id="${session.id}" data-extended-mode="${extendedMode}">
    <div class="session-head">
      <h3>${esc(session.title)}</h3>
      <div class="toggle" role="group">
        <button class="toggle-btn mode-btn active" data-mode="quick" type="button">Quick<span>${esc(session.quickTime)}</span></button>
        <button class="toggle-btn mode-btn" data-mode="extended" type="button">Extended<span>${esc(session.extTime)}</span></button>
      </div>
    </div>
    ${session.note ? `<p class="session-note">${esc(session.note)}</p>` : ""}
    <div class="ex-list">
      <div class="quick-only">${session.quick.map(exerciseHTML).join("")}</div>
      ${hasExtended ? `<div class="extended-only" hidden>${session.extendedAdds.map(exerciseHTML).join("")}</div>` : ""}
    </div>
  </div>`;
}

function renderDaily(){
  return `
    <div class="intro-note">${esc(DAILY.note)}</div>
    ${modsBannerHTML()}
    ${scoresCardHTML()}
    ${DAILY.sessions.map(sessionCardHTML).join("")}
  `;
}

function renderTraining(tab){
  const sections = tab.sections();
  return `
    <p class="tab-subtitle">${esc(tab.subtitle)}</p>
    <div class="section-grid">
      ${sections.map(sec => `
        <details class="section-card">
          <summary>
            <h3>${esc(sec.title)}</h3>
            <span class="sec-time">${esc(sec.time)}</span>
          </summary>
          <div class="sec-body ex-list">
            ${sec.exercises.map(exerciseHTML).join("")}
          </div>
        </details>
      `).join("")}
    </div>
  `;
}

function renderTab(key){
  const tab = TABS[key];
  document.body.dataset.theme = tab.theme;
  const content = document.getElementById("content");
  content.innerHTML = tab.type === "daily" ? renderDaily() : renderTraining(tab);
}

function renderTabs(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = TAB_ORDER.map(key =>
    `<button data-tab="${key}" type="button">${esc(TABS[key].label)}</button>`
  ).join("");
}

function setActiveTab(key){
  document.querySelectorAll("#tabs button").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === key);
  });
  renderTab(key);
  try { localStorage.setItem("mt-active-tab", key); } catch(e){}
}

/* ============================= EVENTS ============================= */

document.addEventListener("click", e => {
  const tabBtn = e.target.closest("#tabs button");
  if (tabBtn) {
    setActiveTab(tabBtn.dataset.tab);
    return;
  }
  const modeBtn = e.target.closest(".mode-btn");
  if (modeBtn) {
    const card = modeBtn.closest(".session-card");
    const isExtended = modeBtn.dataset.mode === "extended";
    card.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b === modeBtn));
    const extendedOnly = card.querySelector(".extended-only");
    if (extendedOnly) extendedOnly.hidden = !isExtended;
    if (card.dataset.extendedMode === "replace") {
      const quickOnly = card.querySelector(".quick-only");
      if (quickOnly) quickOnly.hidden = isExtended;
    }
    return;
  }
});

/* ============================= INIT ============================= */

renderTabs();
let startTab = "daily";
try {
  const saved = localStorage.getItem("mt-active-tab");
  if (saved && TABS[saved]) startTab = saved;
} catch(e){}
setActiveTab(startTab);
</script>
