<title>Mobility Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mobile-first mobility & activation tracker">
<meta name="theme-color" content="#f5f2ea">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --chalk:#1a1a16;
    --iron:#f5f2ea;
    --iron-soft:#ffffff;
    --iron-raised:#ebe6d9;
    --line:#b8b0a0;
    --dim:#4a463e;
    --plate-red:#a8351f;
    --plate-blue:#2a5694;
    --plate-green:#3d7d40;
    --plate-amber:#96680f;
    --accent:var(--plate-blue);
    --accent-dim:rgba(42,86,148,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{margin:0;padding:0}
  body{
    background:var(--iron);
    color:var(--chalk);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding-bottom:48px;
  }
  [data-theme="daily"]{--accent:var(--plate-blue);--accent-dim:rgba(42,86,148,.10)}
  [data-theme="push"]{--accent:var(--plate-red);--accent-dim:rgba(168,53,31,.10)}
  [data-theme="pull"]{--accent:var(--plate-amber);--accent-dim:rgba(150,104,15,.10)}
  [data-theme="legs"]{--accent:var(--plate-green);--accent-dim:rgba(61,125,64,.10)}

  header.topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(245,242,234,.94);
    backdrop-filter:blur(6px);
    border-bottom:2px solid var(--chalk);
    padding:16px 16px 12px;
  }
  .eyebrow{
    font-family:'DM Mono', monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:2px;
  }
  header.topbar h1{
    font-family:'Bebas Neue', sans-serif;
    font-size:28px;
    letter-spacing:.02em;
    line-height:1;
    display:flex;align-items:center;gap:8px;
    margin:2px 0 12px;
    color:var(--chalk);
  }
  header.topbar h1 .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 4px var(--accent-dim);
  }

  nav.tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    padding-bottom:2px;
  }
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{
    flex:0 0 auto;
    background:var(--iron-soft);
    color:var(--chalk);
    border:2px solid var(--line);
    border-radius:5px;
    padding:9px 13px;
    font-family:'DM Mono', monospace;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    white-space:nowrap;
    cursor:pointer;
  }
  nav.tabs button.active{
    background:var(--tab-accent,var(--plate-blue));
    border-color:var(--tab-accent,var(--plate-blue));
    color:#fff;
    font-weight:700;
  }
  nav.tabs button[data-tab="daily"].active{--tab-accent:var(--plate-blue)}
  nav.tabs button[data-tab^="push"].active{--tab-accent:var(--plate-red)}
  nav.tabs button[data-tab^="pull"].active{--tab-accent:var(--plate-amber)}
  nav.tabs button[data-tab^="legs"].active{--tab-accent:var(--plate-green)}

  main{
    max-width:640px;
    margin:0 auto;
    padding:18px 14px 8px;
  }

  .intro-note{
    background:var(--iron-soft);
    border:1px dashed var(--line);
    color:var(--dim);
    font-family:'DM Mono', monospace;
    font-size:12.5px;
    line-height:1.6;
    padding:10px 14px;
    border-radius:6px;
    margin-bottom:14px;
  }

  /* ---- personal mods banner ---- */
  details.mods-banner{
    background:var(--iron-soft);
    border:1.5px dashed var(--plate-amber);
    border-radius:6px;
    margin-bottom:14px;
    overflow:hidden;
  }
  details.mods-banner summary{
    list-style:none;
    cursor:pointer;
    padding:12px 14px;
    font-family:'DM Mono', monospace;
    font-weight:700;
    font-size:13px;
    letter-spacing:.05em;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:var(--plate-amber);
  }
  details.mods-banner summary::-webkit-details-marker{display:none}
  details.mods-banner summary::after{
    content:"›";
    transform:rotate(90deg);
    transition:transform .15s;
    font-size:20px;
    line-height:1;
    color:var(--dim);
  }
  details.mods-banner[open] summary::after{transform:rotate(270deg)}
  .mods-list{
    padding:2px 14px 14px;
    display:flex;
    flex-direction:column;
    gap:9px;
    border-top:1px dashed var(--line);
  }
  .mods-list div{
    font-family:'DM Mono', monospace;
    font-size:12.5px;
    line-height:1.5;
    color:var(--dim);
    padding-top:9px;
  }
  .mods-list div:first-child{padding-top:10px}
  .mods-list b{color:var(--chalk);font-weight:600}

  /* ---- mobility scores ---- */
  .scores-card{
    background:var(--iron-soft);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px;
    margin-bottom:16px;
  }
  .scores-card-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
    margin-bottom:12px;
  }
  .scores-card h2{
    font-family:'DM Mono', monospace;
    margin:0;
    font-size:12px;
    font-weight:700;
    color:var(--dim);
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  .scores-updated{
    font-family:'DM Mono', monospace;
    font-size:10.5px;
    color:var(--dim);
    white-space:nowrap;
  }
  .score-item{
    border-bottom:1px dashed var(--line);
    padding-bottom:10px;
    margin-bottom:10px;
  }
  .score-item:last-of-type{border-bottom:none;margin-bottom:0;padding-bottom:0}
  .score-row{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
  }
  .score-label{
    flex:0 0 96px;
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    color:var(--chalk);
    font-weight:600;
    line-height:1.25;
  }
  .score-bar-col{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
  .score-bar-track{
    display:block;
    height:12px;
    background:#e5e7eb;
    border:1px solid rgba(0,0,0,0.1);
    border-radius:6px;
    overflow:hidden;
  }
  .score-bar-fill{display:block;height:100%;transition:width .3s ease}
  .score-status{
    font-family:'DM Mono', monospace;
    font-size:9.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .score-pct{
    flex:0 0 auto;
    font-family:'DM Mono', monospace;
    font-size:12.5px;
    font-weight:700;
    color:var(--dim);
    min-width:38px;
    text-align:right;
  }
  .score-edit-btn{
    flex:0 0 auto;
    background:none;
    border:none;
    font-size:14px;
    line-height:1;
    cursor:pointer;
    padding:4px;
    opacity:.65;
  }
  .score-edit-btn:hover{opacity:1}

  /* ---- sub-metrics panel ---- */
  .submetrics-panel{
    margin-top:10px;
    padding:10px 4px 2px 14px;
    border-top:1px dashed var(--line);
    border-left:2px solid var(--line);
    margin-left:2px;
  }
  .submetric{margin-bottom:14px}
  .submetric:last-of-type{margin-bottom:8px}
  .submetric-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:5px;
  }
  .submetric-label{
    font-family:'Inter', sans-serif;
    font-size:12px;
    font-weight:600;
    color:var(--chalk);
  }
  .submetric-edit-btn{
    flex:0 0 auto;
    background:none;
    border:none;
    font-size:12px;
    line-height:1;
    cursor:pointer;
    padding:3px;
    opacity:.6;
  }
  .submetric-edit-btn:hover{opacity:1}
  .key-metric-badge{
    display:inline-block;
    background:var(--plate-blue);
    color:#fff;
    font-family:'DM Mono', monospace;
    font-size:9px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    padding:2px 6px;
    border-radius:3px;
    vertical-align:middle;
  }
  .priority-badge{
    display:inline-block;
    background:var(--plate-red);
    color:#fff;
    font-family:'DM Mono', monospace;
    font-size:8.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    padding:1px 5px;
    border-radius:3px;
    vertical-align:middle;
  }
  .submetric-dual{display:flex;gap:10px}
  .submetric-side{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
  .submetric-side-label{
    font-family:'DM Mono', monospace;
    font-size:9.5px;
    font-weight:700;
    color:var(--dim);
    flex:0 0 auto;
    white-space:nowrap;
  }
  .submetric-single{display:flex;align-items:center;gap:8px}
  .submetric-bar-track{
    display:block;
    flex:1;
    height:8px;
    background:#e5e7eb;
    border:1px solid rgba(0,0,0,0.1);
    border-radius:4px;
    overflow:hidden;
    min-width:0;
  }
  .submetric-bar-fill{display:block;height:100%;transition:width .3s ease}
  .submetric-pct{
    flex:0 0 auto;
    font-family:'DM Mono', monospace;
    font-size:10.5px;
    font-weight:700;
    color:var(--dim);
    min-width:30px;
    text-align:right;
  }
  .submetric-status-row{display:flex;gap:14px;margin-top:3px}
  .submetric-status{
    font-family:'DM Mono', monospace;
    font-size:9px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .submetric-progress{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
    font-family:'DM Mono', monospace;
    font-size:10px;
    color:var(--dim);
    margin-top:3px;
  }
  .submetric-progress .up{color:var(--plate-green);font-weight:700}
  .submetric-progress .down{color:var(--plate-red);font-weight:700}
  .submetric-progress-side{font-weight:700;color:var(--chalk)}
  .submetric-spark-wrap{display:inline-flex;width:56px;height:16px}
  .submetric-spark-wrap .score-spark{width:56px;height:16px}
  .view-exercises-btn{
    display:block;
    width:100%;
    background:var(--iron-raised);
    border:1px solid var(--line);
    border-radius:5px;
    padding:9px;
    margin-top:6px;
    font-family:'DM Mono', monospace;
    font-size:11px;
    font-weight:700;
    color:var(--chalk);
    cursor:pointer;
    text-align:center;
  }

  /* ---- score editor ---- */
  .score-editor{padding:10px 2px 2px}
  .score-editor-side-label{
    font-family:'DM Mono', monospace;
    font-size:10.5px;
    color:var(--dim);
    text-transform:uppercase;
    letter-spacing:.05em;
    margin-bottom:2px;
  }
  .score-slider{width:100%;accent-color:var(--plate-blue);margin-bottom:4px}
  .score-slider-readout{
    font-family:'DM Mono', monospace;
    font-size:13px;
    font-weight:700;
    color:var(--chalk);
    text-align:center;
    margin-bottom:8px;
  }
  .score-editor-actions{display:flex;gap:8px}
  .score-save-btn,.score-cancel-btn{
    flex:1;
    border-radius:5px;
    font-family:'DM Mono', monospace;
    font-size:12px;
    font-weight:700;
    padding:9px;
    cursor:pointer;
  }
  .score-save-btn{background:var(--plate-blue);border:2px solid var(--plate-blue);color:#fff}
  .score-cancel-btn{background:transparent;border:2px solid var(--line);color:var(--dim)}

  /* ---- score detail / exercise mapping ---- */
  .score-detail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .score-detail-title{font-family:'Bebas Neue', sans-serif;font-size:17px;letter-spacing:.01em;color:var(--chalk)}
  .score-detail-sub{font-family:'DM Mono', monospace;font-size:11px;color:var(--dim);margin-bottom:10px}
  .score-ex-list{display:flex;flex-direction:column;gap:9px;margin-bottom:10px}
  .score-ex-item{display:flex;gap:8px;align-items:flex-start}
  .score-ex-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;margin-top:5px}
  .score-ex-name{font-family:'Inter', sans-serif;font-size:12.5px;font-weight:600;color:var(--chalk)}
  .score-ex-session{font-family:'DM Mono', monospace;font-size:10.5px;color:var(--dim);margin:1px 0 2px}
  .score-ex-why{font-family:'Inter', sans-serif;font-size:12px;color:var(--dim);line-height:1.4}
  .score-note-callout{
    background:var(--accent-dim);
    border-radius:5px;
    padding:9px 11px;
    font-family:'DM Mono', monospace;
    font-size:11.5px;
    color:var(--dim);
    line-height:1.5;
    margin-bottom:10px;
  }
  .score-progress{background:var(--iron-raised);border:1px solid var(--line);border-radius:5px;padding:10px;margin-bottom:10px}
  .score-progress-row{display:flex;justify-content:space-between;gap:8px;font-family:'DM Mono', monospace;font-size:11.5px;color:var(--dim);padding:2px 0}
  .score-progress-row strong{color:var(--chalk);font-weight:700}
  .score-progress-row strong.up{color:var(--plate-green)}
  .score-progress-row strong.down{color:var(--plate-red)}
  .score-progress-spark{margin-top:6px}
  .score-spark{width:100%;height:32px;display:block}

  /* ---- score notes ---- */
  .score-notes{margin-top:2px}
  .score-notes-label{font-family:'DM Mono', monospace;font-size:11px;color:var(--dim);margin-bottom:6px}
  .score-notes-input{
    width:100%;
    min-height:50px;
    background:var(--iron-raised);
    border:1px solid var(--line);
    border-radius:5px;
    padding:8px;
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    color:var(--chalk);
    resize:vertical;
    margin-bottom:6px;
  }
  .score-notes-save{
    background:var(--iron-soft);
    border:2px solid var(--line);
    border-radius:5px;
    padding:7px 12px;
    font-family:'DM Mono', monospace;
    font-size:11px;
    font-weight:700;
    color:var(--chalk);
    cursor:pointer;
    margin-bottom:8px;
  }
  .score-notes-list{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
  .score-note-entry{font-family:'Inter', sans-serif;font-size:12px;color:var(--dim);line-height:1.4}
  .score-note-date{font-family:'DM Mono', monospace;font-size:10px;color:var(--dim);font-weight:700;margin-right:6px}
  .score-notes-toggle{
    background:none;
    border:none;
    color:var(--plate-blue);
    font-family:'DM Mono', monospace;
    font-size:11px;
    font-weight:700;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }

  /* ---- streak card ---- */
  .streak-card{
    background:var(--iron-soft);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .streak-label{font-family:'DM Mono', monospace;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
  .streak-value{font-family:'Bebas Neue', sans-serif;font-size:26px;color:var(--chalk);line-height:1.15}
  .streak-sub{font-family:'DM Mono', monospace;font-size:10.5px;color:var(--dim)}
  .streak-btn{
    flex:0 0 auto;
    background:var(--plate-blue);
    border:2px solid var(--plate-blue);
    color:#fff;
    border-radius:5px;
    padding:10px 14px;
    font-family:'DM Mono', monospace;
    font-size:11.5px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }
  .streak-btn.done{background:var(--plate-green);border-color:var(--plate-green)}
  .streak-btn:disabled{opacity:.85;cursor:default}
  .streak-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
  .streak-undo-btn{
    background:none;
    border:none;
    color:var(--dim);
    font-family:'DM Mono', monospace;
    font-size:10.5px;
    font-weight:700;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }

  /* ---- next session reminder ---- */
  .reminder-banner{
    background:var(--iron-soft);
    border:1px solid var(--line);
    border-left:4px solid var(--plate-blue);
    border-radius:6px;
    padding:12px 14px;
    margin-bottom:14px;
    font-family:'DM Mono', monospace;
    font-size:12.5px;
    color:var(--chalk);
  }
  .reminder-text{cursor:pointer}
  .reminder-edit{opacity:.6;font-size:11px}
  .reminder-picker{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .reminder-picker-label{font-family:'DM Mono', monospace;font-size:11px;color:var(--dim);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
  .reminder-picker-row{display:flex;flex-wrap:wrap;gap:6px}
  .reminder-picker-btn{
    background:var(--iron-raised);
    border:2px solid var(--line);
    border-radius:5px;
    padding:7px 10px;
    font-family:'DM Mono', monospace;
    font-size:11px;
    font-weight:600;
    color:var(--chalk);
    cursor:pointer;
  }

  /* ---- session cards (daily) ---- */
  .session-card{
    background:var(--iron-soft);
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    border-radius:6px;
    padding:14px;
    margin-bottom:14px;
  }
  .session-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:6px;
    flex-wrap:wrap;
  }
  .session-head h3{
    font-family:'Bebas Neue', sans-serif;
    font-size:26px;
    letter-spacing:.02em;
    color:var(--chalk);
    margin:0;
  }
  .session-note{
    font-family:'DM Mono', monospace;
    font-size:12px;
    color:var(--dim);
    margin:0 0 10px;
    font-style:italic;
  }
  .toggle{
    display:flex;
    gap:6px;
  }
  .toggle-btn{
    background:var(--iron-raised);
    border:2px solid var(--line);
    color:var(--chalk);
    font-family:'DM Mono', monospace;
    font-size:11px;
    font-weight:600;
    padding:6px 10px;
    border-radius:5px;
    cursor:pointer;
    line-height:1.3;
    text-align:center;
  }
  .toggle-btn span{display:block;font-weight:500;font-size:9.5px;color:var(--dim);margin-top:1px}
  .toggle-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .toggle-btn.active span{color:rgba(255,255,255,.85)}

  /* ---- exercise list / accordion ---- */
  .ex-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  details.exercise{
    background:var(--iron-soft);
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
  }
  details.exercise summary{
    list-style:none;
    cursor:pointer;
    padding:11px 12px;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px 8px;
  }
  details.exercise summary::-webkit-details-marker{display:none}
  .ex-name{font-family:'Bebas Neue', sans-serif;font-size:18px;letter-spacing:.01em;color:var(--chalk)}
  .ex-dur{font-family:'DM Mono', monospace;font-size:11.5px;color:var(--dim)}
  .ex-chevron{
    margin-left:auto;
    color:var(--dim);
    font-size:18px;
    transform:rotate(90deg);
    transition:transform .15s;
  }
  details.exercise[open] .ex-chevron{transform:rotate(270deg)}
  .badge{
    font-family:'DM Mono', monospace;
    font-size:10px;
    font-weight:700;
    padding:4px 8px;
    border-radius:4px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#fff;
    white-space:nowrap;
  }
  .badge-critical{background:var(--plate-red)}
  .badge-mod{background:var(--plate-amber)}
  .ex-body{
    padding:0 12px 14px;
    border-top:1px solid var(--line);
    padding-top:10px;
    font-family:'DM Mono', monospace;
    color:var(--dim);
  }
  .ex-body p{margin:0 0 10px;font-size:12.5px;line-height:1.55}
  .ex-body p strong{color:var(--chalk);font-weight:600}
  .ex-cues{margin:0 0 10px}
  .ex-cues > strong{color:var(--chalk);font-weight:600;font-size:12.5px}
  .ex-cues ul{margin:6px 0 0;padding-left:18px}
  .ex-cues li{font-size:12.5px;line-height:1.55;font-style:italic;margin-bottom:3px}
  .ex-tip{background:var(--accent-dim);border-radius:5px;padding:8px 10px;margin-bottom:0 !important}
  .ex-tip, .ex-tip strong{color:var(--accent)}

  /* ---- training tab grid ---- */
  .tab-subtitle{
    font-family:'DM Mono', monospace;
    font-size:12px;
    color:var(--dim);
    margin:0 0 14px;
    line-height:1.6;

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function badgesHTML(ex){

  return h;
}

/* ---- scores engine ---- */

function scoreStatus(pct){
  if (pct <= 25) return {color:"#ef4444", label:"Critical"};
  if (pct <= 50) return {color:"#f97316", label:"Needs Work"};
  if (pct <= 75) return {color:"#eab308", label:"Moderate"};
  return {color:"#22c55e", label:"Good"};
}

function dotThemeColor(sessionText){
  const s = sessionText.toLowerCase();
  if (s.includes("push")) return "var(--plate-red)";
  if (s.includes("pull")) return "var(--plate-amber)";
  if (s.includes("legs")) return "var(--plate-green)";
  return "var(--plate-blue)";
}

function formatUpdatedAt(iso){
  if (!iso) return "Not yet updated";
  const d = new Date(iso);
  if (isNaN(d)) return "Not yet updated";
  return "Updated " + d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " · " + d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}

function formatNoteDate(iso){
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}

function sparklineHTML(history, w, h){
  w = w || 160; h = h || 32;
  if (!history || history.length < 2) return "";
  const vals = history.map(entry => entry.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const stepX = vals.length > 1 ? w / (vals.length - 1) : 0;
  const points = vals.map((v,i) => `${(i*stepX).toFixed(1)},${(h - ((v-min)/range)*h).toFixed(1)}`).join(" ");
  return `<svg class="score-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${points}" fill="none" stroke="var(--plate-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline>
  </svg>`;
}

function exerciseListHTML(exercises){
  return `<div class="score-ex-list">
    ${exercises.map((ex,i) => `
      <div class="score-ex-item">
        <span class="score-ex-dot" style="background:${dotThemeColor(ex.session)}"></span>
        <div class="score-ex-body">
          <div class="score-ex-name">${i+1}. ${esc(ex.name)}</div>
          <div class="score-ex-session">${esc(ex.session)}</div>
          <div class="score-ex-why">${esc(ex.why)}</div>
        </div>
      </div>
    `).join("")}
  </div>`;
}

function notesSectionHTML(key){
  const notes = (scoreNotes[key] || []).slice().reverse();
  const showAll = scoresUI.notesExpandedKey === key;
  const visible = showAll ? notes : notes.slice(0,3);
  return `<div class="score-notes">

    <textarea class="score-notes-input" data-key="${key}" placeholder="Optional notes..."></textarea>
    <button type="button" class="score-notes-save" data-action="saveNote" data-key="${key}">Save note</button>
    ${visible.length ? `<div class="score-notes-list">
      ${visible.map(n => `<div class="score-note-entry"><span class="score-note-date">${esc(formatNoteDate(n.t))}</span>${esc(n.text)}</div>`).join("")}
    </div>` : ""}
    ${notes.length > 3 ? `<button type="button" class="score-notes-toggle" data-action="toggleNotes" data-key="${key}">${showAll ? "Show less" : `Show all ${notes.length}`}</button>` : ""}
  </div>`;
}

function progressBlockHTML(rows, history){
  const spark = sparklineHTML(history);
  return `<div class="score-progress">
    ${rows.map(r => `<div class="score-progress-row"><span>${esc(r.label)}</span><strong class="${r.cls||""}">${esc(r.value)}</strong></div>`).join("")}
    ${spark ? `<div class="score-progress-spark">${spark}</div>` : ""}
  </div>`;
}

function changeStr(change){
  if (change === 0) return "No change";
  return change > 0 ? `▲ +${change}%` : `▼ ${change}%`;
}

/* ============================= TIMER ENGINE ============================= */

const PLATE_RED = "#a8351f";
const PLATE_BLUE = "#2a5694";

let timerState = null;
let tickHandle = null;
let wakeLockSentinel = null;
let noSleepInstance = null;

function parseDuration(dur){
  const d = String(dur).trim();

  function toSeconds(numStr, unit){
    const n = parseFloat(numStr);
    return /min/i.test(unit) ? Math.round(n * 60) : Math.round(n);
  }

  const setsMatch = d.match(/(\d+)\s*[×xX]\s*(\d+)\s*reps/);
  if (setsMatch) {
    return { mode:"reps", sets:parseInt(setsMatch[1],10), repsPerSet:parseInt(setsMatch[2],10), eachSide:/each side/i.test(d) };
  }
  const repsMatch = d.match(/(\d+)\s*reps/i);
  if (repsMatch) {
    return { mode:"reps", sets:1, repsPerSet:parseInt(repsMatch[1],10), eachSide:/each side/i.test(d) };
  }

  const rightMatch = d.match(/(\d+(?:\.\d+)?)\s*(min|s)\w*\s*right/i);
  const leftMatch = d.match(/(\d+(?:\.\d+)?)\s*(min|s)\w*\s*left/i);
  if (rightMatch && leftMatch) {
    return { mode:"timer", eachSide:true, left:toSeconds(leftMatch[1], leftMatch[2]), right:toSeconds(rightMatch[1], rightMatch[2]) };
  }

  const eachSideMatch = d.match(/(\d+(?:\.\d+)?)\s*(min|s)\w*\s*each side/i);
  if (eachSideMatch) {
    const secs = toSeconds(eachSideMatch[1], eachSideMatch[2]);
    return { mode:"timer", eachSide:true, left:secs, right:secs };
  }

  const rangeMatch = d.match(/(\d+(?:\.\d+)?)\s*[–-]\s*(\d+(?:\.\d+)?)\s*(min|s)/i);
  if (rangeMatch) {
    const avg = (parseFloat(rangeMatch[1]) + parseFloat(rangeMatch[2])) / 2;
    const secs = /min/i.test(rangeMatch[3]) ? Math.round(avg * 60) : Math.round(avg);
    return { mode:"timer", eachSide:false, total:secs };
  }

  const plainMatch = d.match(/(\d+(?:\.\d+)?)\s*(min|s)/i);
  if (plainMatch) {
    return { mode:"timer", eachSide:false, total:toSeconds(plainMatch[1], plainMatch[2]) };
  }

  return { mode:"timer", eachSide:false, total:30 };
}

function buildPlan(parsed){
  if (parsed.mode === "reps") {
    const sides = parsed.eachSide ? [{label:"Left"},{label:"Right"}] : [{label:"—"}];
    return { mode:"reps", sides, sets: parsed.sets, repsPerSet: parsed.repsPerSet };
  }
  const sides = parsed.eachSide
    ? [{label:"Left", seconds: parsed.left}, {label:"Right", seconds: parsed.right}]
    : [{label:"—", seconds: parsed.total}];
  return { mode:"timer", sides };
}

function formatTime(s){
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s / 60), sec = s % 60;
  return `${m}:${String(sec).padStart(2, "0")}`;
}

function vibrate(){
  try { if (navigator.vibrate) navigator.vibrate(200); } catch(e){}
}

function loadScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function acquireWakeLock(){
  try {
    if ("wakeLock" in navigator) {
      wakeLockSentinel = await navigator.wakeLock.request("screen");
      wakeLockSentinel.addEventListener("release", () => { wakeLockSentinel = null; });
      return;
    }
  } catch(e) { /* fall through to NoSleep fallback */ }
  try {
    if (!noSleepInstance) {
      if (!window.NoSleep) {
        await loadScript("https://cdnjs.cloudflare.com/ajax/libs/nosleep/0.12.0/NoSleep.min.js");
      }
      noSleepInstance = new NoSleep();
    }
    noSleepInstance.enable();
  } catch(e) { /* best effort only */ }
}

function releaseWakeLock(){
  if (wakeLockSentinel) { wakeLockSentinel.release().catch(()=>{}); wakeLockSentinel = null; }
  if (noSleepInstance) { try { noSleepInstance.disable(); } catch(e){} }
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && timerState && !wakeLockSentinel && "wakeLock" in navigator) {
    acquireWakeLock();
  }
});

function beginSide(idx){
  timerState.sideIdx = idx;
  timerState.isRest = false;
  const side = timerState.plan.sides[idx];
  if (timerState.plan.mode === "timer") {
    timerState.phase = "timer";
    timerState.remaining = side.seconds;
    timerState.totalForSide = side.seconds;
  } else {
    timerState.setIdx = 0;
    timerState.repsRemaining = timerState.plan.repsPerSet;
    timerState.phase = "reps";
  }
}

function completeSide(){
  if (timerState.sideIdx + 1 < timerState.plan.sides.length) {
    timerState.sideIdx++;
    timerState.phase = "switch";
    timerState.remaining = 5;
  } else {
    finishExercise();
  }
}

function finishExercise(){
  timerState.phase = "done";
  renderActiveTimer();
  const key = timerState.key;
  setTimeout(() => {
    stopTimer();
    collapseExercise(key);
  }, 2000);
}

function handlePhaseZero(){
  vibrate();
  if (timerState.phase === "switch") {
    beginSide(timerState.sideIdx);
    return;
  }
  if (timerState.isRest) {
    timerState.isRest = false;
    timerState.setIdx++;
    if (timerState.setIdx >= timerState.plan.sets) {
      completeSide();
    } else {
      timerState.repsRemaining = timerState.plan.repsPerSet;
      timerState.phase = "reps";
    }
    return;
  }
  completeSide();
}

function tick(){
  if (!timerState) return;
  if (timerState.phase === "paused" || timerState.phase === "reps" || timerState.phase === "done") return;
  timerState.remaining--;
  if (timerState.remaining <= 0) handlePhaseZero();
  renderActiveTimer();
}

function decrementRep(){
  if (!timerState || timerState.phase !== "reps") return;
  timerState.repsRemaining--;
  if (timerState.repsRemaining <= 0) {
    timerState.setIdx++;
    if (timerState.setIdx >= timerState.plan.sets) {
      vibrate();
      completeSide();
    } else {
      timerState.isRest = true;
      timerState.phase = "timer";
      timerState.remaining = 20;
      timerState.totalForSide = 20;
    }
  }
  renderActiveTimer();
}

function adjustTime(delta){
  if (!timerState || (timerState.phase !== "timer" && timerState.phase !== "switch")) return;
  timerState.remaining = Math.max(10, timerState.remaining + delta);
  if (timerState.phase === "timer") timerState.totalForSide = Math.max(timerState.totalForSide, timerState.remaining);
  renderActiveTimer();
}

function adjustReps(delta){
  if (!timerState || timerState.phase !== "reps") return;
  timerState.repsRemaining = Math.max(1, timerState.repsRemaining + delta);
  renderActiveTimer();
}

function togglePause(){
  if (!timerState) return;
  if (timerState.phase === "paused") {
    timerState.phase = timerState.pausedFrom;
    timerState.pausedFrom = null;
  } else if (timerState.phase === "timer" || timerState.phase === "switch") {
    timerState.pausedFrom = timerState.phase;
    timerState.phase = "paused";
  }
  renderActiveTimer();
}

function stopTimer(){
  if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
  releaseWakeLock();
  const prevKey = timerState ? timerState.key : null;
  timerState = null;
  if (prevKey) resetExerciseDOM(prevKey);
  hideStickyBar();
}

function cancelTimer(){
  stopTimer();
}

function collapseExercise(key){
  const el = document.querySelector(`details[data-ex-key="${CSS.escape(key)}"]`);
  if (el) el.open = false;
}

function resetExerciseDOM(key){
  const el = document.querySelector(`details[data-ex-key="${CSS.escape(key)}"]`);
  if (!el) return;
  const startBtn = el.querySelector(".ex-start-btn");
  const view = el.querySelector(".ex-timer-view");
  if (startBtn) startBtn.hidden = false;
  if (view) { view.hidden = true; view.innerHTML = ""; }
}

function startExercise(key){
  const ex = EXERCISE_REGISTRY[key];
  if (!ex) return;
  if (timerState && timerState.key !== key) stopTimer();

  const el = document.querySelector(`details[data-ex-key="${CSS.escape(key)}"]`);
  const accentColor = el ? getComputedStyle(el).getPropertyValue("--accent").trim() : "";
  const plan = buildPlan(parseDuration(ex.dur));

  timerState = {
    key, name: ex.name, plan,
    sideIdx: -1, setIdx: 0, repsRemaining: 0, remaining: 0, totalForSide: 0,
    phase: "timer", isRest: false, pausedFrom: null,
    accentColor: accentColor || PLATE_BLUE
  };
  beginSide(0);

  acquireWakeLock();
  if (tickHandle) clearInterval(tickHandle);
  tickHandle = setInterval(tick, 1000);
  renderActiveTimer();
}

function ringSVG(pct, warn){
  const r = 52, c = 2 * Math.PI * r;
  const offset = c * (1 - Math.max(0, Math.min(1, pct)));
  const color = warn ? PLATE_RED : (timerState ? timerState.accentColor : PLATE_BLUE);
  return `<div class="timer-ring-wrap">
    <svg class="timer-ring" viewBox="0 0 120 120">
      <circle class="timer-ring-track" cx="60" cy="60" r="${r}"></circle>
      <circle class="timer-ring-fill" cx="60" cy="60" r="${r}" stroke="${color}" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"></circle>
    </svg>
    <div class="timer-number">__NUMBER__</div>
  </div>`;
}

function timerControlsHTML(isReps){
  if (!timerState) return "";
  const paused = timerState.phase === "paused";
  const pauseLabel = paused ? "▶ Resume" : "⏸ Pause";
  const showPause = timerState.phase === "timer" || timerState.phase === "switch" || timerState.phase === "paused";
  if (isReps) {
    return `
      <div class="timer-adjust-row">
        <button type="button" data-action="adjustReps" data-delta="-5">-5</button>
        <button type="button" data-action="adjustReps" data-delta="-1">-1</button>
        <button type="button" data-action="adjustReps" data-delta="1">+1</button>
        <button type="button" data-action="adjustReps" data-delta="5">+5</button>
      </div>
      <div class="timer-action-row">
        <button type="button" class="timer-cancel-btn" data-action="cancel">Cancel</button>
      </div>`;
  }
  return `
    <div class="timer-adjust-row">
      <button type="button" data-action="adjustTime" data-delta="-30">-30s</button>
      <button type="button" data-action="adjustTime" data-delta="-15">-15s</button>
      <button type="button" data-action="adjustTime" data-delta="15">+15s</button>
      <button type="button" data-action="adjustTime" data-delta="30">+30s</button>
    </div>
    <div class="timer-action-row">
      ${showPause ? `<button type="button" class="timer-pause-btn" data-action="pause">${pauseLabel}</button>` : ""}
      <button type="button" class="timer-cancel-btn" data-action="cancel">Cancel</button>
    </div>`;
}

function renderTimerView(){
  if (!timerState) return "";
  const t = timerState;
  const sideLabel = t.plan.sides[t.sideIdx] ? t.plan.sides[t.sideIdx].label : "—";

  if (t.phase === "switch") {
    return `<div class="timer-stage">
      <div class="timer-exname">${esc(t.name)}</div>
      <div class="timer-switch">
        <div class="timer-switch-icon">⇄</div>
        <div class="timer-switch-label">Switch sides</div>
        <div class="timer-switch-note">Left side first</div>
        <div class="timer-switch-count">${t.remaining}</div>
      </div>
      ${timerControlsHTML(false)}
    </div>`;
  }

  if (t.phase === "done") {
    return `<div class="timer-stage">
      <div class="timer-done">
        <div class="timer-done-check">✓</div>
        <div class="timer-done-name">${esc(t.name)}</div>
        <div class="timer-done-label">Done ✓</div>
      </div>
    </div>`;
  }

  if (t.phase === "reps") {
    const pct = t.plan.repsPerSet ? t.repsRemaining / t.plan.repsPerSet : 0;
    const setNote = t.plan.sets > 1 ? `Set ${t.setIdx + 1} of ${t.plan.sets}` : "";
    return `<div class="timer-stage">
      <div class="timer-exname">${esc(t.name)}</div>
      <div class="timer-side">${esc(sideLabel)}</div>
      ${setNote ? `<div class="timer-setnote">${esc(setNote)}</div>` : ""}
      <button class="reps-tap" type="button" data-action="tapRep">${ringSVG(pct, false).replace("__NUMBER__", t.repsRemaining)}</button>
      <div class="timer-hint">Tap to count down reps</div>
      ${timerControlsHTML(true)}
    </div>`;
  }

  const pct = t.totalForSide ? t.remaining / t.totalForSide : 0;
  const warn = t.remaining <= 10 && t.phase !== "paused";
  const label = t.isRest ? "Rest" : esc(sideLabel);
  return `<div class="timer-stage ${warn ? "warn" : ""}">
    <div class="timer-exname">${esc(t.name)}</div>
    <div class="timer-side">${label}</div>
    ${ringSVG(pct, warn).replace("__NUMBER__", formatTime(t.remaining))}
    ${timerControlsHTML(false)}
  </div>`;
}

function hideStickyBar(){
  const bar = document.getElementById("stickyTimerBar");
  if (bar) bar.hidden = true;
}

function updateStickyBar(){
  const bar = document.getElementById("stickyTimerBar");
  if (!bar || !timerState) return;
  const t = timerState;
  let mainText, subText;
  if (t.phase === "done") { mainText = "Done ✓"; subText = t.name; }
  else if (t.phase === "switch") { mainText = "Switch sides"; subText = `${t.remaining}s · Left side first`; }
  else if (t.phase === "reps") { mainText = `${t.repsRemaining} reps left`; subText = t.name; }
  else if (t.phase === "paused") { mainText = "Paused"; subText = t.name; }
  else { mainText = formatTime(t.remaining) + (t.isRest ? " · Rest" : ""); subText = t.name; }

  bar.hidden = false;
  const warn = t.phase === "timer" && t.remaining <= 10;
  bar.style.background = warn ? PLATE_RED : (t.accentColor || PLATE_BLUE);
  bar.innerHTML = `
    <div class="sticky-timer-text">
      <div class="sticky-timer-main">${esc(mainText)}</div>
      <div class="sticky-timer-sub">${esc(subText)}</div>
    </div>
    <div class="sticky-timer-actions">
      ${(t.phase === "timer" || t.phase === "switch" || t.phase === "paused") ? `<button type="button" data-action="pause">${t.phase === "paused" ? "▶" : "⏸"}</button>` : ""}
      <button type="button" data-action="cancel">✕</button>
    </div>`;
}

function scrollToActiveExercise(){
  if (!timerState) return;
  const el = document.querySelector(`details[data-ex-key="${CSS.escape(timerState.key)}"]`);
  if (el) el.scrollIntoView({behavior:"smooth", block:"center"});
}

function renderActiveTimer(){
  if (!timerState) { hideStickyBar(); return; }
  const el = document.querySelector(`details[data-ex-key="${CSS.escape(timerState.key)}"]`);
  if (el) {
    el.open = true;
    let ancestor = el.parentElement;
    while (ancestor) {
      if (ancestor instanceof HTMLDetailsElement) ancestor.open = true;
      ancestor = ancestor.parentElement;
    }
    const startBtn = el.querySelector(".ex-start-btn");
    const view = el.querySelector(".ex-timer-view");
    if (startBtn) startBtn.hidden = true;
    if (view) { view.hidden = false; view.innerHTML = renderTimerView(); }
  }
  updateStickyBar();
}

document.addEventListener("toggle", e => {
  const el = e.target;
  if (!(el instanceof HTMLDetailsElement) || !el.classList.contains("exercise")) return;
  if (!el.open && timerState && timerState.key === el.dataset.exKey) {
    cancelTimer();
  }
}, true);

/* ============================= EVENTS ============================= */

document.addEventListener("click", e => {
  const tabBtn = e.target.closest("#tabs button");
  if (tabBtn) {
    setActiveTab(tabBtn.dataset.tab);
    return;
  }
  const modeBtn = e.target.closest(".mode-btn");
  if (modeBtn) {
    const card = modeBtn.closest(".session-card");
    const isExtended = modeBtn.dataset.mode === "extended";
    card.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b === modeBtn));
    const extendedOnly = card.querySelector(".extended-only");
    if (extendedOnly) extendedOnly.hidden = !isExtended;
    if (card.dataset.extendedMode === "replace") {
      const quickOnly = card.querySelector(".quick-only");
      if (quickOnly) quickOnly.hidden = isExtended;
    }
    return;
  }

  const actionEl = e.target.closest("[data-action]");
  if (actionEl) {
    const action = actionEl.dataset.action;
    if (action === "start") {
      const details = actionEl.closest("details.exercise");
      if (details) startExercise(details.dataset.exKey);
      return;
    }
    if (action === "adjustTime") { adjustTime(parseInt(actionEl.dataset.delta, 10)); return; }
    if (action === "adjustReps") { adjustReps(parseInt(actionEl.dataset.delta, 10)); return; }
    if (action === "pause") { togglePause(); return; }
    if (action === "cancel") { cancelTimer(); return; }
    if (action === "tapRep") { decrementRep(); return; }
    if (action === "toggleCategoryDetail") { toggleCategoryDetail(actionEl.dataset.key); return; }
    if (action === "showMapping") { showMapping(actionEl.dataset.key); return; }
    if (action === "editScore") { editScore(actionEl.dataset.key); return; }
    if (action === "cancelEditScore") { cancelEditScore(); return; }
    if (action === "saveScore") { saveScore(actionEl.dataset.key); return; }
    if (action === "saveScoreDual") { saveScoreDual(actionEl.dataset.key); return; }
    if (action === "saveNote") { saveNote(actionEl.dataset.key); return; }
    if (action === "toggleNotes") { toggleNotes(actionEl.dataset.key); return; }
    if (action === "markComplete") { markStreakComplete(); return; }
    if (action === "undoStreak") { undoStreakComplete(); return; }
    if (action === "toggleReminderPicker") { scoresUI.pickerOpen = !scoresUI.pickerOpen; refreshReminderBanner(); return; }
    if (action === "setLastSession") { setLastSession(actionEl.dataset.key); return; }
  }

  if (e.target.closest("#stickyTimerBar .sticky-timer-text")) {
    scrollToActiveExercise();
    return;
  }
});

document.addEventListener("input", e => {
  const slider = e.target.closest(".score-slider");
  if (!slider) return;
  const side = slider.dataset.side;
  const editor = slider.closest(".score-editor");
  if (!editor) return;
  const readout = side
    ? editor.querySelector(`.score-slider-value[data-side="${side}"]`)
    : editor.querySelector(".score-slider-value");
  if (readout) readout.textContent = slider.value;
});

/* ============================= INIT ============================= */

renderTabs();
let startTab = "daily";
try {
  const saved = localStorage.getItem("mt-active-tab");
  if (saved && TABS[saved]) startTab = saved;
} catch(e){}
setActiveTab(startTab);
</script>
