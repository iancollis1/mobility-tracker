<title>Mobility Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mobile-first mobility & activation tracker">
<meta name="theme-color" content="#f5f2ea">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --chalk:#1a1a16;
    --iron:#f5f2ea;
    --iron-soft:#ffffff;
    --iron-raised:#ebe6d9;
    --line:#b8b0a0;
    --dim:#4a463e;
    --plate-red:#a8351f;
    --plate-blue:#2a5694;
    --plate-green:#3d7d40;
    --plate-amber:#96680f;
    --accent:var(--plate-blue);
    --accent-dim:rgba(42,86,148,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{margin:0;padding:0}
  body{
    background:var(--iron);
    color:var(--chalk);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding-bottom:48px;
  }
  [data-theme="daily"]{--accent:var(--plate-blue);--accent-dim:rgba(42,86,148,.10)}
  [data-theme="push"]{--accent:var(--plate-red);--accent-dim:rgba(168,53,31,.10)}
  [data-theme="pull"]{--accent:var(--plate-amber);--accent-dim:rgba(150,104,15,.10)}
  [data-theme="legs"]{--accent:var(--plate-green);--accent-dim:rgba(61,125,64,.10)}

  header.topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(245,242,234,.94);
    backdrop-filter:blur(6px);
    border-bottom:2px solid var(--chalk);
    padding:16px 16px 12px;
  }
  .eyebrow{
    font-family:'DM Mono', monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:2px;
  }
  header.topbar h1{
    font-family:'Bebas Neue', sans-serif;
    font-size:28px;
    letter-spacing:.02em;
    line-height:1;
    display:flex;align-items:center;gap:8px;
    margin:2px 0 12px;
    color:var(--chalk);
  }
  header.topbar h1 .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 4px var(--accent-dim);
  }

  nav.tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    padding-bottom:2px;
  }
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{
    flex:0 0 auto;
    background:var(--iron-soft);
    color:var(--chalk);
    border:2px solid var(--line);
    border-radius:5px;
    padding:9px 13px;
    font-family:'DM Mono', monospace;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    white-space:nowrap;
    cursor:pointer;
  }
  nav.tabs button.active{
    background:var(--tab-accent,var(--plate-blue));
    border-color:var(--tab-accent,var(--plate-blue));
    color:#fff;
    font-weight:700;
  }
  nav.tabs button[data-tab="daily"].active{--tab-accent:var(--plate-blue)}
  nav.tabs button[data-tab^="push"].active{--tab-accent:var(--plate-red)}
  nav.tabs button[data-tab^="pull"].active{--tab-accent:var(--plate-amber)}
  nav.tabs button[data-tab^="legs"].active{--tab-accent:var(--plate-green)}

  main{
    max-width:640px;
    margin:0 auto;
    padding:18px 14px 8px;
  }

  .intro-note{
    background:var(--iron-soft);
    border:1px dashed var(--line);
    color:var(--dim);
    font-family:'DM Mono', monospace;
    font-size:12.5px;
    line-height:1.6;
    padding:10px 14px;
    border-radius:6px;
    margin-bottom:14px;
  }

  /* ---- personal mods banner ---- */
  details.mods-banner{
    background:var(--iron-soft);
    border:1.5px dashed var(--plate-amber);
    border-radius:6px;
    margin-bottom:14px;
    overflow:hidden;
  }
  details.mods-banner summary{
    list-style:none;
    cursor:pointer;
    padding:12px 14px;
    font-family:'DM Mono', monospace;
    font-weight:700;
    font-size:13px;
    letter-spacing:.05em;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:var(--plate-amber);
  }
  details.mods-banner summary::-webkit-details-marker{display:none}
  details.mods-banner summary::after{
    content:"›";
    transform:rotate(90deg);
    transition:transform .15s;
    font-size:20px;
    line-height:1;
    color:var(--dim);
  }
  details.mods-banner[open] summary::after{transform:rotate(270deg)}
  .mods-list{
    padding:2px 14px 14px;
    display:flex;
    flex-direction:column;
    gap:9px;
    border-top:1px dashed var(--line);
  }
  .mods-list div{
    font-family:'DM Mono', monospace;
    font-size:12.5px;
    line-height:1.5;
    color:var(--dim);
    padding-top:9px;
  }
  .mods-list div:first-child{padding-top:10px}
  .mods-list b{color:var(--chalk);font-weight:600}

  /* ---- mobility scores ---- */
  .scores-card{
    background:var(--iron-soft);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px;
    margin-bottom:16px;
  }
  .scores-card h2{
    font-family:'DM Mono', monospace;
    margin:0 0 12px;
    font-size:12px;
    font-weight:700;
    color:var(--dim);
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  .score-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .score-row:last-child{margin-bottom:0}
  .score-label{
    flex:0 0 118px;
    font-family:'Inter', sans-serif;
    font-size:13px;
    color:var(--chalk);
    font-weight:600;
  }
  .score-bar-track{
    flex:1;
    height:8px;
    background:var(--iron-raised);
    border:1px solid var(--line);
    border-radius:4px;
    overflow:hidden;
  }
  .score-bar-fill{height:100%}
  .score-pct{
    flex:0 0 auto;
    font-family:'DM Mono', monospace;
    font-size:12.5px;
    font-weight:700;
    color:var(--dim);
    min-width:48px;
    text-align:right;
  }

  /* ---- session cards (daily) ---- */
  .session-card{
    background:var(--iron-soft);
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    border-radius:6px;
    padding:14px;
    margin-bottom:14px;
  }
  .session-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:6px;
    flex-wrap:wrap;
  }
  .session-head h3{
    font-family:'Bebas Neue', sans-serif;
    font-size:26px;
    letter-spacing:.02em;
    color:var(--chalk);
    margin:0;
  }
  .session-note{
    font-family:'DM Mono', monospace;
    font-size:12px;
    color:var(--dim);
    margin:0 0 10px;
    font-style:italic;
  }
  .toggle{
    display:flex;
    gap:6px;
  }
  .toggle-btn{
    background:var(--iron-raised);
    border:2px solid var(--line);
    color:var(--chalk);
    font-family:'DM Mono', monospace;
    font-size:11px;
    font-weight:600;
    padding:6px 10px;
    border-radius:5px;
    cursor:pointer;
    line-height:1.3;
    text-align:center;
  }
  .toggle-btn span{display:block;font-weight:500;font-size:9.5px;color:var(--dim);margin-top:1px}
  .toggle-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .toggle-btn.active span{color:rgba(255,255,255,.85)}

  /* ---- exercise list / accordion ---- */
  .ex-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  details.exercise{
    background:var(--iron-soft);
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
  }
  details.exercise summary{
    list-style:none;
    cursor:pointer;
    padding:11px 12px;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px 8px;
  }
  details.exercise summary::-webkit-details-marker{display:none}
  .ex-name{font-family:'Bebas Neue', sans-serif;font-size:18px;letter-spacing:.01em;color:var(--chalk)}
  .ex-dur{font-family:'DM Mono', monospace;font-size:11.5px;color:var(--dim)}
  .ex-chevron{
    margin-left:auto;
    color:var(--dim);
    font-size:18px;
    transform:rotate(90deg);
    transition:transform .15s;
  }
  details.exercise[open] .ex-chevron{transform:rotate(270deg)}
  .badge{
    font-family:'DM Mono', monospace;
    font-size:10px;
    font-weight:700;
    padding:4px 8px;
    border-radius:4px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#fff;
    white-space:nowrap;
  }
  .badge-critical{background:var(--plate-red)}
  .badge-mod{background:var(--plate-amber)}
  .ex-body{
    padding:0 12px 14px;
    border-top:1px solid var(--line);
    padding-top:10px;
    font-family:'DM Mono', monospace;
    color:var(--dim);
  }
  .ex-body p{margin:0 0 10px;font-size:12.5px;line-height:1.55}
  .ex-body p strong{color:var(--chalk);font-weight:600}
  .ex-cues{margin:0 0 10px}
  .ex-cues > strong{color:var(--chalk);font-weight:600;font-size:12.5px}
  .ex-cues ul{margin:6px 0 0;padding-left:18px}
  .ex-cues li{font-size:12.5px;line-height:1.55;font-style:italic;margin-bottom:3px}
  .ex-tip{background:var(--accent-dim);border-radius:5px;padding:8px 10px;margin-bottom:0 !important}
  .ex-tip, .ex-tip strong{color:var(--accent)}

  /* ---- training tab grid ---- */
  .tab-subtitle{
    font-family:'DM Mono', monospace;
    font-size:12px;
    color:var(--dim);
    margin:0 0 14px;
    line-height:1.6;
  }
  .section-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  @media (max-width:420px){
    .section-grid{grid-template-columns:1fr}
  }
  details.section-card{
    background:var(--iron-soft);
    border:1px solid var(--line);
    border-top:4px solid var(--accent);
    border-radius:6px;
    overflow:hidden;
    grid-column:span 1;
  }
  details.section-card[open]{grid-column:1 / -1}
  details.section-card summary{
    list-style:none;
    cursor:pointer;
    padding:13px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
  }
  details.section-card summary::-webkit-details-marker{display:none}
  details.section-card summary h3{
    font-family:'Bebas Neue', sans-serif;
    font-size:21px;
    letter-spacing:.02em;
    color:var(--chalk);
    margin:0;
    line-height:1.2;
  }
  details.section-card summary .sec-time{
    font-family:'DM Mono', monospace;
    font-size:11px;
    color:var(--dim);
    font-weight:600;
    white-space:nowrap;
  }
  details.section-card .sec-body{padding:0 12px 12px}

  footer.app-footer{
    max-width:640px;
    margin:24px auto 0;
    padding:0 14px;
    font-family:'DM Mono', monospace;
    font-size:11px;
    color:var(--dim);
    text-align:center;
    line-height:1.6;
  }

  /* ---- exercise timer ---- */
  .ex-timer-wrap{margin-top:10px}
  .ex-start-btn{
    width:100%;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:5px;
    padding:11px;
    font-family:'DM Mono', monospace;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .ex-timer-view{margin-top:4px}
  .timer-stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:14px 8px 4px;
    border-top:1px dashed var(--line);
  }
  .timer-stage.warn .timer-number{color:var(--plate-red)}
  .timer-exname{font-family:'Bebas Neue', sans-serif;font-size:18px;letter-spacing:.01em;color:var(--chalk);margin-bottom:2px}
  .timer-side{font-family:'DM Mono', monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:10px}
  .timer-setnote{font-family:'DM Mono', monospace;font-size:11px;color:var(--dim);margin-bottom:6px}
  .timer-ring-wrap{position:relative;width:140px;height:140px;margin-bottom:12px}
  .reps-tap{position:relative;width:140px;height:140px;margin-bottom:10px;background:none;border:none;padding:0;cursor:pointer}
  .timer-ring{width:140px;height:140px;transform:rotate(-90deg)}
  .timer-ring-track{fill:none;stroke:var(--iron-raised);stroke-width:8}
  .timer-ring-fill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
  .timer-number{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'DM Mono', monospace;font-weight:700;font-variant-numeric:tabular-nums;
    font-size:32px;color:var(--chalk);
  }
  .timer-hint{font-family:'DM Mono', monospace;font-size:10.5px;color:var(--dim);margin-bottom:10px}
  .timer-adjust-row{display:flex;gap:6px;margin-bottom:8px;width:100%;max-width:280px}
  .timer-adjust-row button{
    flex:1;background:var(--iron-raised);border:2px solid var(--line);border-radius:5px;
    font-family:'DM Mono', monospace;font-size:11.5px;font-weight:700;color:var(--chalk);padding:8px 4px;cursor:pointer;
  }
  .timer-action-row{display:flex;gap:8px;width:100%;max-width:280px;margin-bottom:4px}
  .timer-pause-btn,.timer-cancel-btn{
    flex:1;border-radius:5px;font-family:'DM Mono', monospace;font-size:12px;font-weight:700;
    padding:10px;cursor:pointer;letter-spacing:.03em;
  }
  .timer-pause-btn{background:var(--accent);border:2px solid var(--accent);color:#fff}
  .timer-cancel-btn{background:transparent;border:2px solid var(--line);color:var(--dim)}
  .timer-switch{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:14px}
  .timer-switch-icon{font-size:36px;color:var(--accent)}
  .timer-switch-label{font-family:'Bebas Neue', sans-serif;font-size:22px;color:var(--chalk)}
  .timer-switch-note{font-family:'DM Mono', monospace;font-size:11px;color:var(--plate-amber);text-transform:uppercase;letter-spacing:.05em}
  .timer-switch-count{font-family:'DM Mono', monospace;font-weight:700;font-size:20px;color:var(--dim)}
  .timer-done{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:10px}
  .timer-done-check{font-size:44px;color:var(--plate-green)}
  .timer-done-name{font-family:'Bebas Neue', sans-serif;font-size:20px;color:var(--chalk)}
  .timer-done-label{font-family:'DM Mono', monospace;font-size:13px;font-weight:700;color:var(--plate-green);text-transform:uppercase;letter-spacing:.05em}

  /* ---- sticky timer bar ---- */
  #stickyTimerBar{
    position:fixed;left:14px;right:14px;bottom:14px;z-index:100;
    border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.3);
    padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
    color:#fff;cursor:pointer;
  }
  #stickyTimerBar[hidden]{display:none}
  .sticky-timer-main{font-family:'DM Mono', monospace;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
  .sticky-timer-sub{font-family:'DM Mono', monospace;font-size:11px;opacity:.85;margin-top:1px}
  .sticky-timer-actions{display:flex;gap:8px}
  .sticky-timer-actions button{
    background:rgba(255,255,255,.18);border:none;color:#fff;width:34px;height:34px;border-radius:8px;
    font-size:15px;cursor:pointer;
  }
</style>

<header class="topbar">
  <div class="eyebrow">Mobility &amp; Activation</div>
  <h1><span class="dot" id="themeDot"></span> Mobility Tracker</h1>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="content"></main>

<footer class="app-footer">Personal mobility & activation reference — not medical advice. Stop on any sharp or shooting pain.</footer>

<div id="stickyTimerBar" hidden></div>

<script>
/* ============================= DATA ============================= */

const MODS = [
  "🧱 <b>90/90:</b> yoga block highest setting, no transitions yet",
  "🦵 <b>Couch stretch:</b> thick padding under back knee (ACL history)",
  "🐦 <b>Pigeon:</b> elevated only (bench/couch)",
  "🦵 <b>Hamstring:</b> standing open-hip version only",
  "⚠️ <b>Sharp/shooting sensation</b> = stop immediately",
  "🧠 <b>Nerve flossing:</b> never hold, never force",
  "🍑 <b>Right piriformis</b> cramps during bridges: ball → gun → figure-four before bridges",
  "⬅️ <b>Left side tighter:</b> extra time left side on pigeon, figure-four, hamstring"
];

const SCORES = [
  {label:"Hip ext. rotation", pct:0,  icon:"🔴", color:"var(--plate-red)"},
  {label:"Postchain",         pct:14, icon:"🔴", color:"var(--plate-red)"},
  {label:"Hip flexion",       pct:100,icon:"✅", color:"var(--plate-green)"},
  {label:"Thorax",            pct:51, icon:"🟡", color:"var(--plate-amber)"},
  {label:"Overhead",          pct:54, icon:"🟡", color:"var(--plate-amber)"},
  {label:"Ankles",            pct:100,icon:"✅", color:"var(--plate-green)"}
];

// exercise: {name, dur, feel, cues:[...], tip, critical, mod}

const DAILY = {
  note: "Training days: Morning → training day pre → train → training day post → Evening. Rest days: use Extended versions of all three.",
  sessions: [
    {
      id:"morning", title:"Morning", quickTime:"5 min", extTime:"10 min", replaceOnExtended:true,
      quick:[
        {name:"Pso-Rite Release", dur:"60s each side", critical:true,
          feel:"Deep dull ache inside front of hip — different from surface pressure",
          cues:["One inch inside and below hip bone (ASIS)","Belly breathe — inhale increases pressure, exhale releases","Slow knee bend and straighten on that side","Left side first 60s, right side 45s"],
          tip:"Pulsing = near femoral artery, shift outward. Sharp = support more weight through forearms."},
        {name:"Supine Butterfly", dur:"90s", critical:true,
          feel:"Inner thighs and deep outer hips — gravity-driven opening",
          cues:["Lie on back, knees bent, feet flat — let knees fall outward naturally","Hands lightly on inner thighs, no pushing","Every exhale knees drop further"],
          tip:"Directly targets 0% external rotation — do this every single morning without exception"},
        {name:"Glute Bridges", dur:"10 reps, 2s hold", mod:true,
          feel:"Deep in both glutes — not hamstrings or lower back",
          cues:["Piriformis prep first if cramping: ball 30s → gun 20s → figure-four 45s right side","Drive through heels","Squeeze 2s at top"],
          tip:"Wakes up glutes before the day starts — especially important before sitting at a desk"}
      ],
      extendedAdds:[
        {name:"Pso-Rite Release (Extended)", dur:"90s each side", critical:true,
          feel:"Deep dull ache inside front of hip — different from surface pressure",
          cues:["One inch inside and below hip bone (ASIS)","Belly breathe — inhale increases pressure, exhale releases","Slow knee bend and straighten on that side","90s each side now — both sides equal time"],
          tip:"Pulsing = near femoral artery, shift outward. Sharp = support more weight through forearms."},
        {name:"Supine Butterfly (Extended)", dur:"2.5 min", critical:true,
          feel:"Inner thighs and deep outer hips — gravity-driven opening",
          cues:["After 90s try feet slightly closer to hips to change the angle","Every exhale release further","Progress marker: when knees reach floor, move to Phase 2 — small active pulses outward"],
          tip:"Directly targets 0% external rotation — highest priority stretch in the entire program"},
        {name:"90/90 Hip Flexor Stretch", dur:"60s each side", mod:true,
          feel:"Front of hip and upper thigh of back leg",
          cues:["Tuck pelvis slightly under","Breathe out and let hip sink forward","If nothing, shift back knee further behind you"],
          tip:"🧱 Yoga block on highest setting if doing floor 90/90 afterward"},
        {name:"Glute Bridges (Extended)", dur:"15 reps, 2s hold", mod:true,
          feel:"Deep in both glutes — not hamstrings or lower back",
          cues:["Piriformis prep first if cramping: ball 30s → gun 20s → figure-four 45s right side","Drive through heels","Squeeze 2s at top"],
          tip:"Same cues as quick version, just more reps"}
      ]
    },
    {
      id:"desk-break", title:"Desk Break", quickTime:"3–5 min", extTime:"8–10 min",
      note:"Hip flexor + figure-four every break without fail.",
      quick:[
        {name:"Standing Hip Flexor Stretch", dur:"60s each side", critical:true,
          feel:"Front of hip of standing leg",
          cues:["Tuck pelvis under — key move","Stand tall","If nothing, step standing foot further back"],
          tip:"Do this every single desk break"},
        {name:"Standing Figure-Four", dur:"45s each side", critical:true,
          feel:"Outer hip and glute of crossed leg",
          cues:["Sit back like lowering into chair","Foot flexed to protect knee","Lower = deeper"],
          tip:"Do this every single desk break"},
        {name:"Glute Bridges", dur:"10 reps", mod:true,
          feel:"Deep in both glutes at top",
          cues:["Drive through heels","Squeeze 2s at top","Piriformis prep if cramping"],
          tip:"Resets glutes after sitting"}
      ],
      extendedAdds:[
        {name:"World's Greatest Stretch", dur:"5 reps each side",
          feel:"Hip flexor of back leg, inner thigh of front leg, upper back rotation",
          cues:["Lunge forward","Drop back knee toward floor","Rotate torso and reach opposite arm up","Opposite hand stays planted inside front foot"],
          tip:"Combines hip flexor, hamstring, and thoracic rotation in one flow — best bang for buck when time is short"},
        {name:"Standing Quad Stretch", dur:"45s each side",
          feel:"Front of thigh, standing leg",
          cues:["Hold ankle behind you","Knees together","Tuck pelvis under to deepen","Use wall for balance if needed"],
          tip:"Pairs well with the hip flexor stretch above — opposite side of the same joint"}
      ]
    },
    {
      id:"evening", title:"Evening", quickTime:"5 min", extTime:"15 min",
      note:"Wind-down — longer holds, no bouncing.",
      quick:[
        {name:"Legs Up The Wall", dur:"3 min", critical:true,

const EXERCISE_REGISTRY = {};

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function badgesHTML(ex){
  let h = "";
  if (ex.critical) h += `<span class="badge badge-critical">🔴 CRITICAL</span>`;
  if (ex.mod) h += `<span class="badge badge-mod">⚠️ MOD</span>`;
  return h;
}

function exerciseHTML(ex, key){
  EXERCISE_REGISTRY[key] = ex;
  return `<details class="exercise" data-ex-key="${key}">
    <summary>
      <span class="ex-name">${esc(ex.name)}</span>
      <span class="ex-dur">${esc(ex.dur)}</span>
      ${badgesHTML(ex)}
      <span class="ex-chevron">›</span>
    </summary>
    <div class="ex-body">
      <p>📍 <strong>Where to feel it:</strong> ${esc(ex.feel)}</p>
      <div class="ex-cues">→ <strong>Coaching cues</strong>
        <ul>${ex.cues.map(c => `<li>${esc(c)}</li>`).join("")}</ul>
      </div>
      <p class="ex-tip">💡 <strong>Tip:</strong> ${ex.tip}</p>
      <div class="ex-timer-wrap">
        <button class="ex-start-btn" type="button" data-action="start">▶ Start</button>
        <div class="ex-timer-view" hidden></div>
      </div>
    </div>
  </details>`;
}

function modsBannerHTML(){
  return `<details class="mods-banner">
    <summary>⚠️ Personal Modifications</summary>
    <div class="mods-list">
      ${MODS.map(m => `<div>${m}</div>`).join("")}
    </div>
  </details>`;
}

function scoresCardHTML(){

        <span class="score-pct">${s.icon} ${s.pct}%</span>

    `).join("")}
  </div>`;
}

function sessionCardHTML(session){
  const hasExtended = session.extendedAdds && session.extendedAdds.length;
  const extendedMode = session.replaceOnExtended ? "replace" : "append";
  return `<div class="session-card" data-session-id="${session.id}" data-extended-mode="${extendedMode}">
    <div class="session-head">
      <h3>${esc(session.title)}</h3>
      <div class="toggle" role="group">
        <button class="toggle-btn mode-btn active" data-mode="quick" type="button">Quick<span>${esc(session.quickTime)}</span></button>
        <button class="toggle-btn mode-btn" data-mode="extended" type="button">Extended<span>${esc(session.extTime)}</span></button>
      </div>
    </div>
    ${session.note ? `<p class="session-note">${esc(session.note)}</p>` : ""}
    <div class="ex-list">
      <div class="quick-only">${session.quick.map((ex,i) => exerciseHTML(ex, `daily__${session.id}__quick__${i}`)).join("")}</div>
      ${hasExtended ? `<div class="extended-only" hidden>${session.extendedAdds.map((ex,i) => exerciseHTML(ex, `daily__${session.id}__ext__${i}`)).join("")}</div>` : ""}
    </div>
  </div>`;
}

function renderDaily(){
  return `
    <div class="intro-note">${esc(DAILY.note)}</div>
    ${modsBannerHTML()}
    ${scoresCardHTML()}
    ${DAILY.sessions.map(sessionCardHTML).join("")}
  `;
}

function renderTraining(tab, tabKey){
  const sections = tab.sections();
  return `
    <p class="tab-subtitle">${esc(tab.subtitle)}</p>
    <div class="section-grid">
      ${sections.map(sec => `
        <details class="section-card">
          <summary>
            <h3>${esc(sec.title)}</h3>
            <span class="sec-time">${esc(sec.time)}</span>
          </summary>
          <div class="sec-body ex-list">
            ${sec.exercises.map((ex,i) => exerciseHTML(ex, `${tabKey}__${sec.id}__${i}`)).join("")}
          </div>
        </details>
      `).join("")}
    </div>
  `;
}

function renderTab(key){
  const tab = TABS[key];
  document.body.dataset.theme = tab.theme;
  const content = document.getElementById("content");
  content.innerHTML = tab.type === "daily" ? renderDaily() : renderTraining(tab, key);
  renderActiveTimer();
}

function renderTabs(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = TAB_ORDER.map(key =>
    `<button data-tab="${key}" type="button">${esc(TABS[key].label)}</button>`
  ).join("");
}

function setActiveTab(key){
  document.querySelectorAll("#tabs button").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === key);
  });
  renderTab(key);
  try { localStorage.setItem("mt-active-tab", key); } catch(e){}
}

/* ============================= TIMER ENGINE ============================= */

const PLATE_RED = "#a8351f";
const PLATE_BLUE = "#2a5694";

let timerState = null;
let tickHandle = null;
let wakeLockSentinel = null;
let noSleepInstance = null;

function parseDuration(dur){
  const d = String(dur).trim();

  function toSeconds(numStr, unit){
    const n = parseFloat(numStr);
    return /min/i.test(unit) ? Math.round(n * 60) : Math.round(n);
  }

  const setsMatch = d.match(/(\d+)\s*[×xX]\s*(\d+)\s*reps/);
  if (setsMatch) {
    return { mode:"reps", sets:parseInt(setsMatch[1],10), repsPerSet:parseInt(setsMatch[2],10), eachSide:/each side/i.test(d) };
  }
  const repsMatch = d.match(/(\d+)\s*reps/i);
  if (repsMatch) {
    return { mode:"reps", sets:1, repsPerSet:parseInt(repsMatch[1],10), eachSide:/each side/i.test(d) };
  }

  const rightMatch = d.match(/(\d+(?:\.\d+)?)\s*(min|s)\w*\s*right/i);
  const leftMatch = d.match(/(\d+(?:\.\d+)?)\s*(min|s)\w*\s*left/i);
  if (rightMatch && leftMatch) {
    return { mode:"timer", eachSide:true, left:toSeconds(leftMatch[1], leftMatch[2]), right:toSeconds(rightMatch[1], rightMatch[2]) };
  }

  const eachSideMatch = d.match(/(\d+(?:\.\d+)?)\s*(min|s)\w*\s*each side/i);
  if (eachSideMatch) {
    const secs = toSeconds(eachSideMatch[1], eachSideMatch[2]);
    return { mode:"timer", eachSide:true, left:secs, right:secs };
  }

  const rangeMatch = d.match(/(\d+(?:\.\d+)?)\s*[–-]\s*(\d+(?:\.\d+)?)\s*(min|s)/i);
  if (rangeMatch) {
    const avg = (parseFloat(rangeMatch[1]) + parseFloat(rangeMatch[2])) / 2;
    const secs = /min/i.test(rangeMatch[3]) ? Math.round(avg * 60) : Math.round(avg);
    return { mode:"timer", eachSide:false, total:secs };
  }

  const plainMatch = d.match(/(\d+(?:\.\d+)?)\s*(min|s)/i);
  if (plainMatch) {
    return { mode:"timer", eachSide:false, total:toSeconds(plainMatch[1], plainMatch[2]) };
  }

  return { mode:"timer", eachSide:false, total:30 };
}

function buildPlan(parsed){
  if (parsed.mode === "reps") {
    const sides = parsed.eachSide ? [{label:"Left"},{label:"Right"}] : [{label:"—"}];
    return { mode:"reps", sides, sets: parsed.sets, repsPerSet: parsed.repsPerSet };
  }
  const sides = parsed.eachSide
    ? [{label:"Left", seconds: parsed.left}, {label:"Right", seconds: parsed.right}]
    : [{label:"—", seconds: parsed.total}];
  return { mode:"timer", sides };
}

function formatTime(s){
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s / 60), sec = s % 60;
  return `${m}:${String(sec).padStart(2, "0")}`;
}

function vibrate(){
  try { if (navigator.vibrate) navigator.vibrate(200); } catch(e){}
}

function loadScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function acquireWakeLock(){
  try {
    if ("wakeLock" in navigator) {
      wakeLockSentinel = await navigator.wakeLock.request("screen");
      wakeLockSentinel.addEventListener("release", () => { wakeLockSentinel = null; });
      return;
    }
  } catch(e) { /* fall through to NoSleep fallback */ }
  try {
    if (!noSleepInstance) {
      if (!window.NoSleep) {
        await loadScript("https://cdnjs.cloudflare.com/ajax/libs/nosleep/0.12.0/NoSleep.min.js");
      }
      noSleepInstance = new NoSleep();
    }
    noSleepInstance.enable();
  } catch(e) { /* best effort only */ }
}

function releaseWakeLock(){
  if (wakeLockSentinel) { wakeLockSentinel.release().catch(()=>{}); wakeLockSentinel = null; }
  if (noSleepInstance) { try { noSleepInstance.disable(); } catch(e){} }
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && timerState && !wakeLockSentinel && "wakeLock" in navigator) {
    acquireWakeLock();
  }
});

function beginSide(idx){
  timerState.sideIdx = idx;
  timerState.isRest = false;
  const side = timerState.plan.sides[idx];
  if (timerState.plan.mode === "timer") {
    timerState.phase = "timer";
    timerState.remaining = side.seconds;
    timerState.totalForSide = side.seconds;
  } else {
    timerState.setIdx = 0;
    timerState.repsRemaining = timerState.plan.repsPerSet;
    timerState.phase = "reps";
  }
}

function completeSide(){
  if (timerState.sideIdx + 1 < timerState.plan.sides.length) {
    timerState.sideIdx++;
    timerState.phase = "switch";
    timerState.remaining = 5;
  } else {
    finishExercise();
  }
}

function finishExercise(){
  timerState.phase = "done";
  renderActiveTimer();
  const key = timerState.key;
  setTimeout(() => {
    stopTimer();
    collapseExercise(key);
  }, 2000);
}

function handlePhaseZero(){
  vibrate();
  if (timerState.phase === "switch") {
    beginSide(timerState.sideIdx);
    return;
  }
  if (timerState.isRest) {
    timerState.isRest = false;
    timerState.setIdx++;
    if (timerState.setIdx >= timerState.plan.sets) {
      completeSide();
    } else {
      timerState.repsRemaining = timerState.plan.repsPerSet;
      timerState.phase = "reps";
    }
    return;
  }
  completeSide();
}

function tick(){
  if (!timerState) return;
  if (timerState.phase === "paused" || timerState.phase === "reps" || timerState.phase === "done") return;
  timerState.remaining--;
  if (timerState.remaining <= 0) handlePhaseZero();
  renderActiveTimer();
}

function decrementRep(){
  if (!timerState || timerState.phase !== "reps") return;
  timerState.repsRemaining--;
  if (timerState.repsRemaining <= 0) {
    timerState.setIdx++;
    if (timerState.setIdx >= timerState.plan.sets) {
      vibrate();
      completeSide();
    } else {
      timerState.isRest = true;
      timerState.phase = "timer";
      timerState.remaining = 20;
      timerState.totalForSide = 20;
    }
  }
  renderActiveTimer();
}

function adjustTime(delta){
  if (!timerState || (timerState.phase !== "timer" && timerState.phase !== "switch")) return;
  timerState.remaining = Math.max(10, timerState.remaining + delta);
  if (timerState.phase === "timer") timerState.totalForSide = Math.max(timerState.totalForSide, timerState.remaining);
  renderActiveTimer();
}

function adjustReps(delta){
  if (!timerState || timerState.phase !== "reps") return;
  timerState.repsRemaining = Math.max(1, timerState.repsRemaining + delta);
  renderActiveTimer();
}

function togglePause(){
  if (!timerState) return;
  if (timerState.phase === "paused") {
    timerState.phase = timerState.pausedFrom;
    timerState.pausedFrom = null;
  } else if (timerState.phase === "timer" || timerState.phase === "switch") {
    timerState.pausedFrom = timerState.phase;
    timerState.phase = "paused";
  }
  renderActiveTimer();
}

function stopTimer(){
  if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
  releaseWakeLock();
  const prevKey = timerState ? timerState.key : null;
  timerState = null;
  if (prevKey) resetExerciseDOM(prevKey);
  hideStickyBar();
}

function cancelTimer(){
  stopTimer();
}

function collapseExercise(key){
  const el = document.querySelector(`details[data-ex-key="${CSS.escape(key)}"]`);
  if (el) el.open = false;
}

function resetExerciseDOM(key){
  const el = document.querySelector(`details[data-ex-key="${CSS.escape(key)}"]`);
  if (!el) return;
  const startBtn = el.querySelector(".ex-start-btn");
  const view = el.querySelector(".ex-timer-view");
  if (startBtn) startBtn.hidden = false;
  if (view) { view.hidden = true; view.innerHTML = ""; }
}

function startExercise(key){
  const ex = EXERCISE_REGISTRY[key];
  if (!ex) return;
  if (timerState && timerState.key !== key) stopTimer();

  const el = document.querySelector(`details[data-ex-key="${CSS.escape(key)}"]`);
  const accentColor = el ? getComputedStyle(el).getPropertyValue("--accent").trim() : "";
  const plan = buildPlan(parseDuration(ex.dur));

  timerState = {
    key, name: ex.name, plan,
    sideIdx: -1, setIdx: 0, repsRemaining: 0, remaining: 0, totalForSide: 0,
    phase: "timer", isRest: false, pausedFrom: null,
    accentColor: accentColor || PLATE_BLUE
  };
  beginSide(0);

  acquireWakeLock();
  if (tickHandle) clearInterval(tickHandle);
  tickHandle = setInterval(tick, 1000);
  renderActiveTimer();
}

function ringSVG(pct, warn){
  const r = 52, c = 2 * Math.PI * r;
  const offset = c * (1 - Math.max(0, Math.min(1, pct)));
  const color = warn ? PLATE_RED : (timerState ? timerState.accentColor : PLATE_BLUE);
  return `<div class="timer-ring-wrap">
    <svg class="timer-ring" viewBox="0 0 120 120">
      <circle class="timer-ring-track" cx="60" cy="60" r="${r}"></circle>
      <circle class="timer-ring-fill" cx="60" cy="60" r="${r}" stroke="${color}" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"></circle>
    </svg>
    <div class="timer-number">__NUMBER__</div>
  </div>`;
}

function timerControlsHTML(isReps){
  if (!timerState) return "";
  const paused = timerState.phase === "paused";
  const pauseLabel = paused ? "▶ Resume" : "⏸ Pause";
  const showPause = timerState.phase === "timer" || timerState.phase === "switch" || timerState.phase === "paused";
  if (isReps) {
    return `
      <div class="timer-adjust-row">
        <button type="button" data-action="adjustReps" data-delta="-5">-5</button>
        <button type="button" data-action="adjustReps" data-delta="-1">-1</button>
        <button type="button" data-action="adjustReps" data-delta="1">+1</button>
        <button type="button" data-action="adjustReps" data-delta="5">+5</button>
      </div>
      <div class="timer-action-row">
        <button type="button" class="timer-cancel-btn" data-action="cancel">Cancel</button>
      </div>`;
  }
  return `
    <div class="timer-adjust-row">
      <button type="button" data-action="adjustTime" data-delta="-30">-30s</button>
      <button type="button" data-action="adjustTime" data-delta="-15">-15s</button>
      <button type="button" data-action="adjustTime" data-delta="15">+15s</button>
      <button type="button" data-action="adjustTime" data-delta="30">+30s</button>
    </div>
    <div class="timer-action-row">
      ${showPause ? `<button type="button" class="timer-pause-btn" data-action="pause">${pauseLabel}</button>` : ""}
      <button type="button" class="timer-cancel-btn" data-action="cancel">Cancel</button>
    </div>`;
}

function renderTimerView(){
  if (!timerState) return "";
  const t = timerState;
  const sideLabel = t.plan.sides[t.sideIdx] ? t.plan.sides[t.sideIdx].label : "—";

  if (t.phase === "switch") {
    return `<div class="timer-stage">
      <div class="timer-exname">${esc(t.name)}</div>
      <div class="timer-switch">
        <div class="timer-switch-icon">⇄</div>
        <div class="timer-switch-label">Switch sides</div>
        <div class="timer-switch-note">Left side first</div>
        <div class="timer-switch-count">${t.remaining}</div>
      </div>
      ${timerControlsHTML(false)}
    </div>`;
  }

  if (t.phase === "done") {
    return `<div class="timer-stage">
      <div class="timer-done">
        <div class="timer-done-check">✓</div>
        <div class="timer-done-name">${esc(t.name)}</div>
        <div class="timer-done-label">Done ✓</div>
      </div>
    </div>`;
  }

  if (t.phase === "reps") {
    const pct = t.plan.repsPerSet ? t.repsRemaining / t.plan.repsPerSet : 0;
    const setNote = t.plan.sets > 1 ? `Set ${t.setIdx + 1} of ${t.plan.sets}` : "";
    return `<div class="timer-stage">
      <div class="timer-exname">${esc(t.name)}</div>
      <div class="timer-side">${esc(sideLabel)}</div>
      ${setNote ? `<div class="timer-setnote">${esc(setNote)}</div>` : ""}
      <button class="reps-tap" type="button" data-action="tapRep">${ringSVG(pct, false).replace("__NUMBER__", t.repsRemaining)}</button>
      <div class="timer-hint">Tap to count down reps</div>
      ${timerControlsHTML(true)}
    </div>`;
  }

  const pct = t.totalForSide ? t.remaining / t.totalForSide : 0;
  const warn = t.remaining <= 10 && t.phase !== "paused";
  const label = t.isRest ? "Rest" : esc(sideLabel);
  return `<div class="timer-stage ${warn ? "warn" : ""}">
    <div class="timer-exname">${esc(t.name)}</div>
    <div class="timer-side">${label}</div>
    ${ringSVG(pct, warn).replace("__NUMBER__", formatTime(t.remaining))}
    ${timerControlsHTML(false)}
  </div>`;
}

function hideStickyBar(){
  const bar = document.getElementById("stickyTimerBar");
  if (bar) bar.hidden = true;
}

function updateStickyBar(){
  const bar = document.getElementById("stickyTimerBar");
  if (!bar || !timerState) return;
  const t = timerState;
  let mainText, subText;
  if (t.phase === "done") { mainText = "Done ✓"; subText = t.name; }
  else if (t.phase === "switch") { mainText = "Switch sides"; subText = `${t.remaining}s · Left side first`; }
  else if (t.phase === "reps") { mainText = `${t.repsRemaining} reps left`; subText = t.name; }
  else if (t.phase === "paused") { mainText = "Paused"; subText = t.name; }
  else { mainText = formatTime(t.remaining) + (t.isRest ? " · Rest" : ""); subText = t.name; }

  bar.hidden = false;
  const warn = t.phase === "timer" && t.remaining <= 10;
  bar.style.background = warn ? PLATE_RED : (t.accentColor || PLATE_BLUE);
  bar.innerHTML = `
    <div class="sticky-timer-text">
      <div class="sticky-timer-main">${esc(mainText)}</div>
      <div class="sticky-timer-sub">${esc(subText)}</div>
    </div>
    <div class="sticky-timer-actions">
      ${(t.phase === "timer" || t.phase === "switch" || t.phase === "paused") ? `<button type="button" data-action="pause">${t.phase === "paused" ? "▶" : "⏸"}</button>` : ""}
      <button type="button" data-action="cancel">✕</button>
    </div>`;
}

function scrollToActiveExercise(){
  if (!timerState) return;
  const el = document.querySelector(`details[data-ex-key="${CSS.escape(timerState.key)}"]`);
  if (el) el.scrollIntoView({behavior:"smooth", block:"center"});
}

function renderActiveTimer(){
  if (!timerState) { hideStickyBar(); return; }
  const el = document.querySelector(`details[data-ex-key="${CSS.escape(timerState.key)}"]`);
  if (el) {
    el.open = true;
    let ancestor = el.parentElement;
    while (ancestor) {
      if (ancestor instanceof HTMLDetailsElement) ancestor.open = true;
      ancestor = ancestor.parentElement;
    }
    const startBtn = el.querySelector(".ex-start-btn");
    const view = el.querySelector(".ex-timer-view");
    if (startBtn) startBtn.hidden = true;
    if (view) { view.hidden = false; view.innerHTML = renderTimerView(); }
  }
  updateStickyBar();
}

document.addEventListener("toggle", e => {
  const el = e.target;
  if (!(el instanceof HTMLDetailsElement) || !el.classList.contains("exercise")) return;
  if (!el.open && timerState && timerState.key === el.dataset.exKey) {
    cancelTimer();
  }
}, true);

/* ============================= EVENTS ============================= */

document.addEventListener("click", e => {
  const tabBtn = e.target.closest("#tabs button");
  if (tabBtn) {
    setActiveTab(tabBtn.dataset.tab);
    return;
  }
  const modeBtn = e.target.closest(".mode-btn");
  if (modeBtn) {
    const card = modeBtn.closest(".session-card");
    const isExtended = modeBtn.dataset.mode === "extended";
    card.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b === modeBtn));
    const extendedOnly = card.querySelector(".extended-only");
    if (extendedOnly) extendedOnly.hidden = !isExtended;
    if (card.dataset.extendedMode === "replace") {
      const quickOnly = card.querySelector(".quick-only");
      if (quickOnly) quickOnly.hidden = isExtended;
    }
    return;
  }

  const actionEl = e.target.closest("[data-action]");
  if (actionEl) {
    const action = actionEl.dataset.action;
    if (action === "start") {
      const details = actionEl.closest("details.exercise");
      if (details) startExercise(details.dataset.exKey);
      return;
    }
    if (action === "adjustTime") { adjustTime(parseInt(actionEl.dataset.delta, 10)); return; }
    if (action === "adjustReps") { adjustReps(parseInt(actionEl.dataset.delta, 10)); return; }
    if (action === "pause") { togglePause(); return; }
    if (action === "cancel") { cancelTimer(); return; }
    if (action === "tapRep") { decrementRep(); return; }
  }

  if (e.target.closest("#stickyTimerBar .sticky-timer-text")) {
    scrollToActiveExercise();
    return;
  }
});

/* ============================= INIT ============================= */

renderTabs();
let startTab = "daily";
try {
  const saved = localStorage.getItem("mt-active-tab");
  if (saved && TABS[saved]) startTab = saved;
} catch(e){}
setActiveTab(startTab);
</script>
